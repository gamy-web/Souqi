<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سوقي | بيع واشتري بسهولة</title>
<meta name="description" content="سوقي - منصة سهلة للبيع والشراء">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f6f8f7;color:#17231d}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.header{background:#0b8f55;color:#fff;position:sticky;top:0;z-index:50;box-shadow:0 3px 15px #0002}
.nav{max-width:1150px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:28px;font-weight:900}
.logo span{font-size:13px;display:block;opacity:.85}
.navBtns{display:flex;gap:8px;align-items:center}
.btn{padding:11px 16px;border-radius:12px;font-weight:700}
.btnWhite{background:#fff;color:#087c4a}
.btnGreen{background:#0b8f55;color:#fff}
.btnLight{background:#e9f7f0;color:#087c4a}
.hero{max-width:1150px;margin:22px auto;padding:42px 25px;border-radius:24px;background:linear-gradient(135deg,#087d4b,#16ad6b);color:white;box-shadow:0 10px 30px #087d4b30}
.hero h1{font-size:38px;margin:0 0 12px}
.hero p{font-size:18px;opacity:.95}
.searchBox{display:flex;gap:10px;margin-top:25px;max-width:750px}
.searchBox input{flex:1;padding:15px;border:0;border-radius:14px;outline:0}
.container{max-width:1150px;margin:auto;padding:0 18px 40px}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:28px 0 15px}
.sectionTitle h2{margin:0;font-size:23px}
.categories{display:flex;gap:10px;overflow:auto;padding-bottom:5px}
.cat{background:#fff;border:1px solid #e1ebe6;padding:11px 17px;border-radius:30px;white-space:nowrap;color:#176b48;font-weight:700}
.cat.active,.cat:hover{background:#0b8f55;color:#fff}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 5px 20px #0000000d;position:relative;border:1px solid #edf1ef;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px #00000015}
.cardImg{height:190px;background:#edf3ef;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cardImg img{width:100%;height:100%;object-fit:cover}
.noImg{font-size:45px;color:#9db0a6}
.cardBody{padding:14px}
.cardTitle{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:#0b8f55;font-size:19px;font-weight:900;margin-top:8px}
.meta{font-size:12px;color:#78857f;margin-top:7px}
.cardActions{display:flex;gap:7px;margin-top:12px}
.cardActions button{flex:1;padding:9px;border-radius:10px}
.detailsBtn{background:#edf8f2;color:#087c4a}
.heart{position:absolute;top:10px;left:10px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:0 3px 10px #0002;font-size:21px;color:#78857f;z-index:2}
.heart.active{color:#e63962}
.empty{text-align:center;background:#fff;padding:35px;border-radius:18px;color:#78857f}
.loader{text-align:center;padding:35px;color:#0b8f55}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.modalBox{background:#fff;width:min(600px,100%);max-height:90vh;overflow:auto;border-radius:22px;padding:22px;position:relative}
.close{position:absolute;left:15px;top:12px;width:35px;height:35px;border-radius:50%;background:#f0f3f1;font-size:20px}
.modal h2{margin-top:0;color:#087c4a}
.formGroup{margin-bottom:13px}
.formGroup label{display:block;font-weight:700;margin-bottom:6px}
.formGroup input,.formGroup textarea,.formGroup select{width:100%;padding:12px;border:1px solid #dce5e0;border-radius:11px;outline:0}
.formGroup textarea{min-height:100px;resize:vertical}
.submit{width:100%;padding:13px;background:#0b8f55;color:#fff;border-radius:12px;font-weight:800}
.detailImg{height:270px;border-radius:15px;background:#edf3ef;overflow:hidden;margin-bottom:15px}
.detailImg img{width:100%;height:100%;object-fit:cover}
.detailPrice{font-size:26px;color:#0b8f55;font-weight:900}
.detailDesc{line-height:1.8;color:#52615a;margin:12px 0}
.detailActions{display:flex;gap:10px}
.detailActions button{flex:1;padding:13px;border-radius:12px;font-weight:800}
.whatsapp{background:#25d366;color:#fff}
.favoriteFilter{background:#fff;color:#087c4a;border:1px solid #dce9e2;padding:10px 15px;border-radius:12px;font-weight:700}
.toast{position:fixed;bottom:20px;right:20px;background:#17231d;color:#fff;padding:13px 18px;border-radius:12px;z-index:200;display:none}
.toast.show{display:block}
footer{background:#10251b;color:#fff;text-align:center;padding:25px;margin-top:30px}
@media(max-width:600px){
.hero{margin:12px;padding:28px 18px}
.hero h1{font-size:28px}
.searchBox{flex-direction:column}
.nav{padding:11px}
.logo{font-size:23px}
.btn{padding:9px 11px}
.products{grid-template-columns:repeat(2,1fr);gap:10px}
.cardImg{height:145px}
.cardBody{padding:10px}
.cardTitle{font-size:14px}
.price{font-size:16px}
.cardActions button{font-size:12px;padding:8px}
}
</style>
</head>

<body>

<header class="header">
<div class="nav">
<div class="logo">سوقي<span>بيع • اشتري • بسهولة</span></div>
<div class="navBtns">
<button class="btn btnWhite" id="loginBtn">دخول</button>
<button class="btn btnWhite" id="addBtn">+ بيع منتج</button>
</div>
</div>
</header>

<section class="hero">
<h1>بيع واشتري بسهولة 🚀</h1>
<p>كل اللي محتاجه قريب منك في مكان واحد.</p>
<div class="searchBox">
<input id="searchInput" type="search" placeholder="ابحث عن منتج...">
<button class="btn btnWhite" id="searchBtn">بحث 🔍</button>
</div>
</section>

<main class="container">

<div class="sectionTitle">
<h2>التصنيفات</h2>
</div>

<div class="categories" id="categories">
<button class="cat active" data-cat="all">الكل</button>
<button class="cat" data-cat="سيارات">🚗 سيارات</button>
<button class="cat" data-cat="موبايلات">📱 موبايلات</button>
<button class="cat" data-cat="عقارات">🏠 عقارات</button>
<button class="cat" data-cat="أثاث">🛋️ أثاث</button>
<button class="cat" data-cat="ملابس">👕 ملابس</button>
<button class="cat" data-cat="أخرى">📦 أخرى</button>
</div>

<div class="sectionTitle">
<h2 id="productsTitle">أحدث المنتجات</h2>
<button class="favoriteFilter" id="favoritesBtn">❤️ المفضلة</button>
</div>

<div id="products" class="products">
<div class="loader">جاري تحميل المنتجات...</div>
</div>

</main>

<footer>
<div>سوقي © 2026</div>
<div style="margin-top:7px;opacity:.7">منصة بسيطة للبيع والشراء</div>
</footer>

<!-- Login -->
<div class="modal" id="loginModal">
<div class="modalBox">
<button class="close" data-close="loginModal">×</button>
<h2>تسجيل الدخول</h2>

<div class="formGroup">
<label>البريد الإلكتروني</label>
<input id="loginEmail" type="email" placeholder="example@email.com">
</div>

<div class="formGroup">
<label>كلمة المرور</label>
<input id="loginPassword" type="password" placeholder="كلمة المرور">
</div>

<button class="submit" id="doLogin">دخول</button>

<p style="text-align:center">
ليس لديك حساب؟
<button id="showSignup" style="background:none;color:#087c4a;font-weight:800">إنشاء حساب</button>
</p>

<div id="signupArea" style="display:none">
<hr>
<h2>إنشاء حساب</h2>
<div class="formGroup">
<label>البريد الإلكتروني</label>
<input id="signupEmail" type="email">
</div>
<div class="formGroup">
<label>كلمة المرور</label>
<input id="signupPassword" type="password">
</div>
<button class="submit" id="doSignup">إنشاء الحساب</button>
</div>
</div>
</div>

<!-- Add Product -->
<div class="modal" id="addModal">
<div class="modalBox">
<button class="close" data-close="addModal">×</button>
<h2>إضافة منتج</h2>

<div class="formGroup">
<label>اسم المنتج</label>
<input id="productName" placeholder="مثال: iPhone 15">
</div>

<div class="formGroup">
<label>السعر</label>
<input id="productPrice" type="number" placeholder="السعر بالجنيه">
</div>

<div class="formGroup">
<label>التصنيف</label>
<select id="productCategory">
<option value="سيارات">سيارات</option>
<option value="موبايلات">موبايلات</option>
<option value="عقارات">عقارات</option>
<option value="أثاث">أثاث</option>
<option value="ملابس">ملابس</option>
<option value="أخرى">أخرى</option>
</select>
</div>

<div class="formGroup">
<label>رابط صورة المنتج</label>
<input id="productImage" placeholder="https://...">
</div>

<div class="formGroup">
<label>الوصف</label>
<textarea id="productDescription" placeholder="اكتب تفاصيل المنتج"></textarea>
</div>

<div class="formGroup">
<label>رقم واتساب</label>
<input id="productWhatsapp" placeholder="مثال: 201xxxxxxxxx">
</div>

<button class="submit" id="publishButton">نشر المنتج</button>
</div>
</div>

<!-- Details -->
<div class="modal" id="detailsModal">
<div class="modalBox">
<button class="close" data-close="detailsModal">×</button>
<div id="detailsContent"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL="https://dbufhbeygczlfttdpinf.supabase.co";
const SUPABASE_KEY="sb_publishable_ffb08aL-n96nfgZZwjj3fw_KolUjymN";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let allProducts=[];
let currentCategory="all";
let favorites=JSON.parse(localStorage.getItem("souqi_favorites")||"[]");
let showFavorites=false;

const productsEl=document.getElementById("products");
const searchInput=document.getElementById("searchInput");
const toast=document.getElementById("toast");

function showToast(msg){
toast.textContent=msg;
toast.classList.add("show");
setTimeout(()=>toast.classList.remove("show"),2500);
}

function openModal(id){
document.getElementById(id).classList.add("show");
}

function closeModal(id){
document.getElementById(id).classList.remove("show");
}

document.querySelectorAll("[data-close]").forEach(btn=>{
btn.onclick=()=>closeModal(btn.dataset.close);
});

document.querySelectorAll(".modal").forEach(modal=>{
modal.addEventListener("click",e=>{
if(e.target===modal) modal.classList.remove("show");
});
});

document.getElementById("loginBtn").onclick=()=>openModal("loginModal");
document.getElementById("addBtn").onclick=async()=>{
const {data}=await supabaseClient.auth.getUser();
if(!data.user){
openModal("loginModal");
showToast("سجل الدخول أولاً");
return;
}
openModal("addModal");
};

document.getElementById("showSignup").onclick=()=>{
document.getElementById("signupArea").style.display="block";
};

document.getElementById("doLogin").onclick=async()=>{
const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

if(!email||!password){
showToast("اكتب البريد وكلمة المرور");
return;
}

const {error}=await supabaseClient.auth.signInWithPassword({email,password});

if(error){
showToast("بيانات الدخول غير صحيحة");
return;
}

closeModal("loginModal");
showToast("تم تسجيل الدخول بنجاح");
updateAuthButton();
};

document.getElementById("doSignup").onclick=async()=>{
const email=document.getElementById("signupEmail").value.trim();
const password=document.getElementById("signupPassword").value;

if(!email||!password){
showToast("أكمل البيانات");
return;
}

if(password.length<6){
showToast("كلمة المرور 6 أحرف على الأقل");
return;
}

const {error}=await supabaseClient.auth.signUp({email,password});

if(error){
showToast(error.message);
return;
}

showToast("تم إنشاء الحساب، تحقق من البريد إذا طُلب منك");
};

async function updateAuthButton(){
const {data}=await supabaseClient.auth.getUser();
const btn=document.getElementById("loginBtn");

if(data.user){
btn.textContent="حسابي";
btn.onclick=async()=>{
await supabaseClient.auth.signOut();
showToast("تم تسجيل الخروج");
updateAuthButton();
};
}else{
btn.textContent="دخول";
btn.onclick=()=>openModal("loginModal");
}
}

function saveFavorites(){
localStorage.setItem("souqi_favorites",JSON.stringify(favorites));
}

function isFavorite(id){
return favorites.includes(String(id));
}

function toggleFavorite(id){
id=String(id);

if(isFavorite(id)){
favorites=favorites.filter(x=>x!==id);
showToast("تمت الإزالة من المفضلة");
}else{
favorites.push(id);
showToast("تمت الإضافة للمفضلة ❤️");
}

saveFavorites();
renderProducts();
}

function productImage(p){
return p.image_url||p.image||p.photo||"";
}

function productName(p){
return p.name||p.title||"منتج بدون اسم";
}

function productPrice(p){
const price=p.price;
if(price===null||price===undefined||price==="") return "السعر عند التواصل";
return Number(price).toLocaleString("ar-EG")+" جنيه";
}

function productCategory(p){
return p.category||"أخرى";
}

function renderProducts(){
let list=[...allProducts];

const q=searchInput.value.trim().toLowerCase();

if(currentCategory!=="all"){
list=list.filter(p=>productCategory(p)===currentCategory);
}

if(q){
list=list.filter(p=>
productName(p).toLowerCase().includes(q)||
productCategory(p).toLowerCase().includes(q)||
String(p.description||"").toLowerCase().includes(q)
);
}

if(showFavorites){
list=list.filter(p=>isFavorite(p.id));
}

if(!list.length){
productsEl.innerHTML='<div class="empty" style="grid-column:1/-1">لا توجد منتجات مطابقة 🔎</div>';
return;
}

productsEl.innerHTML=list.map(p=>{
const id=String(p.id);
const img=productImage(p);

return `
<div class="card">
<button class="heart ${isFavorite(id)?"active":""}" onclick="toggleFavorite('${id}')">
${isFavorite(id)?"♥":"♡"}
</button>

<div class="cardImg">
${img
?`<img src="${escapeHtml(img)}" onerror="this.style.display='none';this.parentElement.innerHTML='<div class=noImg>📦</div>'">`
:`<div class="noImg">📦</div>`}
</div>

<div class="cardBody">
<div class="cardTitle">${escapeHtml(productName(p))}</div>
<div class="price">${productPrice(p)}</div>
<div class="meta">${escapeHtml(productCategory(p))}</div>

<div class="cardActions">
<button class="detailsBtn" onclick="showDetails('${id}')">التفاصيل</button>
<button class="btnGreen" onclick="contactWhatsApp('${id}')">واتساب</button>
</div>
</div>
</div>
`;
}).join("");
}

function escapeHtml(value){
return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function findProduct(id){
return allProducts.find(p=>String(p.id)===String(id));
}

function showDetails(id){
const p=findProduct(id);
if(!p)return;

const img=productImage(p);
const whatsapp=p.whatsapp||p.phone||p.contact||"";

document.getElementById("detailsContent").innerHTML=`
<div class="detailImg">
${img
?`<img src="${escapeHtml(img)}" onerror="this.style.display='none'">`
:`<div class="noImg" style="height:100%;display:flex;align-items:center;justify-content:center">📦</div>`}
</div>

<h2>${escapeHtml(productName(p))}</h2>
<div class="detailPrice">${productPrice(p)}</div>

<div class="meta">التصنيف: ${escapeHtml(productCategory(p))}</div>

<div class="detailDesc">
${escapeHtml(p.description||"لا يوجد وصف للمنتج")}
</div>

<div class="detailActions">
<button class="detailsBtn" onclick="toggleFavorite('${String(p.id)}')">
${isFavorite(String(p.id))?"♥ إزالة من المفضلة":"♡ إضافة للمفضلة"}
</button>
<button class="whatsapp" onclick="contactWhatsApp('${String(p.id)}')">
تواصل واتساب
</button>
</div>
`;

openModal("detailsModal");
}

function contactWhatsApp(id){
const p=findProduct(id);
if(!p)return;

let phone=p.whatsapp||p.phone||p.contact||"";
phone=String(phone).replace(/[^\d]/g,"");

if(!phone){
showToast("رقم واتساب غير متوفر");
return;
}

if(phone.startsWith("01")) phone="20"+phone.substring(1);

const text=encodeURIComponent(
`مرحباً، أنا مهتم بالمنتج: ${productName(p)}`
);

window.open(`https://wa.me/${phone}?text=${text}`,"_blank");
}

async function loadProducts(){
productsEl.innerHTML='<div class="loader">جاري تحميل المنتجات...</div>';

try{
const result=await Promise.race([
supabaseClient.from("products").select("*").order("created_at",{ascending:false}),
new Promise(resolve=>setTimeout(()=>resolve({data:null,error:{message:"timeout"}}),8000))
]);

if(result.error||!result.data){
allProducts=[];
productsEl.innerHTML='<div class="empty" style="grid-column:1/-1">لم نتمكن من تحميل المنتجات حالياً.<br>يمكنك المحاولة مرة أخرى.</div>';
return;
}

allProducts=result.data||[];
renderProducts();

}catch(e){
console.error(e);
productsEl.innerHTML='<div class="empty" style="grid-column:1/-1">حدث خطأ أثناء تحميل المنتجات.</div>';
}
}

document.querySelectorAll(".cat").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
currentCategory=btn.dataset.cat;
showFavorites=false;
document.getElementById("productsTitle").textContent="أحدث المنتجات";
renderProducts();
};
});

document.getElementById("searchBtn").onclick=renderProducts;

searchInput.addEventListener("input",renderProducts);

document.getElementById("favoritesBtn").onclick=()=>{
showFavorites=!showFavorites;
document.getElementById("favoritesBtn").textContent=
showFavorites?"↩ كل المنتجات":"❤️ المفضلة";

document.getElementById("productsTitle").textContent=
showFavorites?"المنتجات المفضلة":"أحدث المنتجات";

renderProducts();
};

document.getElementById("publishButton").onclick=async()=>{
const {data}=await supabaseClient.auth.getUser();

if(!data.user){
showToast("سجل الدخول أولاً");
closeModal("addModal");
openModal("loginModal");
return;
}

const name=document.getElementById("productName").value.trim();
const price=document.getElementById("productPrice").value;
const category=document.getElementById("productCategory").value;
const image=document.getElementById("productImage").value.trim();
const description=document.getElementById("productDescription").value.trim();
const whatsapp=document.getElementById("productWhatsapp").value.trim();

if(!name){
showToast("اكتب اسم المنتج");
return;
}

const button=document.getElementById("publishButton");
button.disabled=true;
button.textContent="جاري النشر...";

try{
const {error}=await supabaseClient.from("products").insert([{
name,
price:price?Number(price):null,
category,
image_url:image||null,
description:description||null,
whatsapp:whatsapp||null,
user_id:data.user.id
}]);

if(error){
console.error(error);
showToast("تعذر نشر المنتج");
button.disabled=false;
button.textContent="نشر المنتج";
return;
}

showToast("تم نشر المنتج بنجاح 🎉");

[
"productName",
"productPrice",
"productImage",
"productDescription",
"productWhatsapp"
].forEach(id=>document.getElementById(id).value="");

closeModal("addModal");
await loadProducts();

}catch(e){
console.error(e);
showToast("حدث خطأ أثناء النشر");
}

button.disabled=false;
button.textContent="نشر المنتج";
};

supabaseClient.auth.onAuthStateChange(()=>{
updateAuthButton();
});

updateAuthButton();
loadProducts();
</script>

</body>
</html>
