<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوقي - سوقك الإلكتروني</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f5f7fa;
color:#222
}
header{
background:#0d6efd;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap
}
.logo{font-size:28px;font-weight:bold}
button{
border:0;
border-radius:8px;
padding:12px 16px;
font-size:15px;
cursor:pointer
}
.header-buttons{display:flex;gap:8px}
.login-btn{background:white;color:#0d6efd}
.sell-btn{background:#198754;color:white}

.hero{
background:white;
text-align:center;
padding:35px 15px
}
.hero h1{
color:#0d6efd;
font-size:34px;
margin:0 0 10px
}
.hero p{color:#666;margin:0 0 25px}
.search-box{
max-width:700px;
margin:auto;
display:flex;
gap:8px
}
#searchInput{
flex:1;
padding:14px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
outline:0
}
.search-button{
background:#0d6efd;
color:white
}

.categories{
text-align:center;
padding:25px 15px
}
.categories h2{margin-bottom:15px}
.category-buttons{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:8px
}
.category-btn{
background:white;
border:1px solid #ddd
}
.category-btn.active{
background:#0d6efd;
color:white
}

.products-section{
max-width:1100px;
margin:auto;
padding:20px 15px 50px
}
.section-title{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px
}
#count{color:#666}
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:18px
}
.product{
background:white;
border-radius:12px;
padding:18px;
box-shadow:0 3px 12px rgba(0,0,0,.08)
}
.product-image{
height:150px;
background:#e9ecef;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
font-size:55px;
margin-bottom:15px
}
.product h3{margin:0 0 10px}
.price{
color:#198754;
font-size:20px;
font-weight:bold;
margin-bottom:8px
}
.location{
color:#777;
margin-bottom:15px
}
.contact{
width:100%;
background:#25D366;
color:white;
font-weight:bold
}
.delete{
width:100%;
background:#dc3545;
color:white;
margin-top:8px
}
#empty{
display:none;
text-align:center;
background:white;
padding:30px;
border-radius:10px;
color:#777
}

footer{
background:#212529;
color:white;
text-align:center;
padding:20px
}

/* النوافذ */
.modal{
display:none;
position:fixed;
z-index:1000;
inset:0;
background:rgba(0,0,0,.6);
padding:20px;
overflow:auto
}
.modal-box{
background:white;
max-width:500px;
margin:40px auto;
padding:22px;
border-radius:12px;
position:relative
}
.modal-box h2{
margin-top:0;
color:#0d6efd
}
.close{
position:absolute;
left:12px;
top:10px;
background:#eee;
font-size:20px;
padding:5px 10px
}

.form-group label{
