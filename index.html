<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوقي | سوقك الإلكتروني</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,"Segoe UI",sans-serif;
background:#f5f7fb;
color:#172033
}
button,input,select{font-family:inherit}
button{cursor:pointer}

.header{
background:linear-gradient(135deg,#1261e8,#1749b7);
color:white
}
.nav{
max-width:1150px;
margin:auto;
padding:16px 20px;
display:flex;
align-items:center;
justify-content:space-between
}
.logo{
font-size:27px;
font-weight:900;
display:flex;
align-items:center;
gap:10px
}
.logo-icon{
background:white;
color:#1261e8;
width:45px;
height:45px;
border-radius:14px;
display:flex;
align-items:center;
justify-content:center
}
.nav-actions{
display:flex;
gap:8px
}
.nav-button{
border:0;
border-radius:12px;
padding:11px 15px;
font-weight:bold;
background:rgba(255,255,255,.15);
color:white
}
.nav-add{
background:white;
color:#1261e8
}

.hero{
max-width:1150px;
margin:auto;
padding:45px 20px 60px
}
.hero h1{
font-size:48px;
margin:10px 0
}
.hero h1 span{color:#bfe0ff}
.hero p{
font-size:18px;
line-height:1.8;
color:#e5edff;
max-width:700px
}
.hero-buttons{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:25px
}
.hero-main,.hero-second{
padding:14px 22px;
border-radius:14px;
font-size:16px;
font-weight:bold
}
.hero-main{
border:0;
background:white;
color:#1261e8
}
.hero-second{
border:1px solid rgba(255,255,255,.3);
background:rgba(255,255,255,.1);
color:white
}

.user-box{
display:none;
max-width:1150px;
margin:-20px auto 20px;
padding:0 20px
}
.user-inner{
background:white;
border-radius:18px;
padding:14px 18px;
box-shadow:0 8px 30px #0001;
display:flex;
justify-content:space-between;
align-items:center
}
.logout{
border:0;
background:#fff0f1;
color:#d52d3d;
padding:10px 15px;
border-radius:10px;
font-weight:bold
}

.container{
max-width:1150px;
margin:auto;
padding:20px 20px 50px
}
.search-box{
background:white;
padding:8px 15px;
border-radius:18px;
display:flex;
align-items:center;
box-shadow:0 5px 25px #0000000b;
margin-bottom:25px
}
.search-input{
width:100%;
border:0;
outline:0;
font-size:17px;
padding:12px
}

.section-title{
display:flex;
justify-content:space-between;
align-items:center
}
.section-title h2{font-size:22px}
.categories{
display:flex;
gap:8px;
overflow-x:auto;
padding:5px 0 15px
}
.category{
border:1px solid #ddd;
background:white;
padding:10px 17px;
border-radius:25px;
white-space:nowrap;
font-weight:bold
}
.category.active{
background:#1261e8;
color:white;
border-color:#1261e8
}

.products-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:20px
}
.products-head h2{font-size:23px}

.products{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px
}
.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 7px 25px #0000000c;
border:1px solid #e8ebf0
}
.card-top{
height:175px;
background:linear-gradient(145deg,#edf4ff,#f9fbff);
display:flex;
align-items:center;
justify-content:center;
position:relative
}
.card-icon{font-size:75px}
.category-label{
position:absolute;
top:12px;
right:12px;
background:white;
padding:6px 10px;
border-radius:20px;
font-size:12px
}
.card-body{padding:18px}
.card h3{
margin:0 0 10px;
font-size:21px
}
.price{
font-size:25px;
font-weight:900;
color:#16805a;
margin-bottom:12px
}
.price small{
font-size:13px;
color:#777
}
.info{
color:#697586;
font-size:14px;
margin:8px 0
}
.whatsapp{
display:block;
text-align:center;
text-decoration:none;
background:#20c96b;
color:white;
padding:13px;
border-radius:12px;
margin-top:15px;
font-weight:bold
}
.delete{
width:100%;
border:0;
background:#fff0f1;
color:#d52d3d;
padding:12px;
border-radius:12px;
margin-top:8px;
font-weight:bold
}

.empty{
grid-column:1/-1;
background:white;
padding:50px 20px;
border-radius:20px;
text-align:center;
color:#777
}
.empty-icon{font-size:50px}

.message{
display:none;
padding:13px;
border-radius:12px;
margin:15px 0;
font-weight:bold
}
.message.success{
display:block;
background:#e4f7ed;
color:#137344
}
.message.error{
display:block;
background:#fff0f1;
color:#a51f2c
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0009;
z-index:9999;
align-items:center;
justify-content:center;
padding:15px
}
.modal-box{
background:white;
width:100%;
max-width:470px;
border-radius:22px;
padding:23px;
max-height:90vh;
overflow:auto
}
.modal-header{
display:flex;
justify-content:space-between;
align-items:center
}
.close{
border:0;
background:#eee;
width:38px;
height:38px;
border-radius:50%;
font-size:22px
}
.input{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:11px;
margin:6px 0;
font-size:16px;
outline:0
}
.modal-buttons{
display:flex;
gap:8px;
margin-top:12px
}
.save,.cancel{
flex:1;
padding:13px;
border:0;
border-radius:11px;
font-weight:bold
}
.save{
background:#1261e8;
color:white
}
.cancel{background:#eee}

.tabs{
display:flex;
gap:5px;
background:#f1f3f7;
padding:5px;
border-radius:11px;
margin-bottom:12px
}
.tab{
flex:1;
border:0;
background:transparent;
padding:10px;
border-radius:8px;
font-weight:bold
}
.tab.active{
background:white;
color:#1261e8
}
.auth-message{
display:none;
padding:10px;
border-radius:10px;
margin-top:8px
}
.auth-message.error{
display:block;
background:#fff0f1;
color:#a51f2c
}
.auth-message.success{
display:block;
background:#e4f7ed;
color:#137344
}

.footer{
background:#101827;
color:#aaa;
text-align:center;
padding:30px 15px
}
.footer strong{
display:block;
color:white;
font-size:22px;
margin-bottom:8px
}

@media(max-width:600px){
.nav{padding:12px}
.logo{font-size:21px}
.logo-icon{width:40px;height:40px}
.nav-button{padding:9px;font-size:12px}
.hero{padding:30px 15px 45px}
.hero h1{font-size:35px}
.hero p{font-size:16px}
.hero-main,.hero-second{width:100%}
.container{padding:15px}
.user-box{padding:0 15px}
.user-inner{
flex-direction:column;
align-items:stretch;
gap:10px
}
.logout{width:100%}
.products{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header class="header">

<nav class="nav">

<div class="logo">
<div class="logo-icon">🛒</div>
سوقي
</div>

<div class="nav-actions">

<button class="nav-button nav-add" id="addButton">
＋ أضف منتج

</div>

</nav>

<div class="hero">

<h1>
بيع واشتري
<span>بسهولة</span>
</h1>

<p>
اكتشف المنتجات المعروضة حولك،
وانشر منتجاتك ليشوفها الجميع
ويتواصلوا معك مباشرة.
</p>

<div class="hero-buttons">

<button class="hero-main" id="heroAddButton">
🛍️ أضف منتجك الآن

<button class="hero-second" id="heroBrowseButton">
🔎 تصفح المنتجات

<div>
👤

class="input"

<script>

/* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://dbufhbeygczlfttdpinf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ffb08aL-n96nfgZZwjj3fw_KolUjymN";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
VARIABLES
========================= */

let products=[];
let currentUser=null;
let selectedCategory="الكل";
let authMode="login";


/* =========================
ELEMENTS
========================= */

const productsBox=
document.getElementById("products");

const searchInput=
document.getElementById("search");

const authModal=
document.getElementById("authModal");

const productModal=
document.getElementById("productModal");

const userBox=
document.getElementById("userBox");

const userEmail=
document.getElementById("userEmail");

const loginButton=
document.getElementById("loginButton");

const productsCount=
document.getElementById("productsCount");

const messageBox=
document.getElementById("message");


/* =========================
MESSAGES
========================= */

function showMessage(text,type){

messageBox.textContent=text;

messageBox.className=
"message "+type;

}


/* =========================
AUTH MODAL
========================= */

function openAuth(){

authModal.style.display="flex";

setLoginMode();

}

function closeAuth(){

authModal.style.display="none";

}

function setLoginMode(){

authMode="login";

document.getElementById("loginTab")
.classList.add("active");

document.getElementById("signupTab")
.classList.remove("active");

document.getElementById("password2")
.style.display="none";

document.getElementById("authAction")
.textContent="دخول";

clearAuthMessage();

}

function setSignupMode(){

authMode="signup";

document.getElementById("loginTab")
.classList.remove("active");

document.getElementById("signupTab")
.classList.add("active");

document.getElementById("password2")
.style.display="block";

document.getElementById("authAction")
.textContent="إنشاء حساب";

clearAuthMessage();

}

function showAuthMessage(text,type){

const box=
document.getElementById("authMessage");

box.textContent=text;

box.className=
"auth-message "+type;

}

function clearAuthMessage(){

const box=
document.getElementById("authMessage");

box.textContent="";

box.className="auth-message";

}


/* =========================
AUTH
========================= */

async function handleAuth(){

const email=
document.getElementById("email")
.value.trim();

const password=
document.getElementById("password")
.value;

const password2=
document.getElementById("password2")
.value;


if(!email || !password){

showAuthMessage(
"اكتب البريد الإلكتروني وكلمة المرور.",
"error"
);

return;

}


if(authMode==="signup"){

if(password!==password2){

showAuthMessage(
"كلمتا المرور غير متطابقتين.",
"error"
);

return;

}

if(password.length<6){

showAuthMessage(
"كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
"error"
);

return;

}


const {data,error}=
await supabaseClient.auth.signUp({
email:email,
password:password
});


if(error){

showAuthMessage(
error.message,
"error"
);

return;

}


if(data.session){

showAuthMessage(
"تم إنشاء الحساب بنجاح ✅",
"success"
);

setTimeout(closeAuth,800);

}else{

showAuthMessage(
"تم إنشاء الحساب. راجع بريدك لتأكيد الحساب ✅",
"success"
);

}

return;

}


const {data,error}=
await supabaseClient.auth.signInWithPassword({
email:email,
password:password
});


if(error){

showAuthMessage(
"بيانات الدخول غير صحيحة أو الحساب غير مؤكد.",
"error"
);

return;

}


currentUser=data.user;

updateUserUI();

closeAuth();

}


/* =========================
USER
========================= */

async function loadUser(){

const {data}=
await supabaseClient.auth.getSession();

currentUser=
data.session?.user || null;

updateUserUI();

}


function updateUserUI(){

if(currentUser){

userBox.style.display="block";

userEmail.textContent=
currentUser.email || "";

loginButton.textContent="👤 حسابي";

}else{

userBox.style.display="none";

loginButton.textContent="👤 دخول";

}

}


/* =========================
LOAD PRODUCTS
========================= */

async function loadProducts(){

productsBox.innerHTML=`
<div class="empty">
<div class="empty-icon">⏳</div>
جاري تحميل المنتجات...
</div>
`;


const result=
await supabaseClient
.from("products")
.select("*")
.order("created_at",{ascending:false});


if(result.error){

console.error(result.error);

productsBox.innerHTML=`
<div class="empty">
<div class="empty-icon">⚠️</div>
<h3>تعذر تحميل المنتجات</h3>
<p>حدث خطأ في الاتصال بقاعدة البيانات.</p>
</div>
`;

return;

}


products=result.data || [];

renderProducts();

}


/* =========================
RENDER
========================= */

function renderProducts(){

const search=
searchInput.value
.trim()
.toLowerCase();


const filtered=
products.filter(product=>{

const name=
String(product.name||"")
.toLowerCase();

const location=
String(product.location||"")
.toLowerCase();

const category=
String(product.category||"")
.toLowerCase();

const searchMatch=
!search ||
name.includes(search) ||
location.includes(search) ||
category.includes(search);

const categoryMatch=
selectedCategory==="الكل" ||
product.category===selectedCategory;

return searchMatch && categoryMatch;

});


productsCount.textContent=
filtered.length+" منتج";


if(filtered.length===0){

productsBox.innerHTML=`
<div class="empty">
<div class="empty-icon">📦</div>
<h3>لا توجد منتجات</h3>
<p>لم نجد منتجات مطابقة.</p>
</div>
`;

return;

}


productsBox.innerHTML=
filtered.map(product=>{

const owner=
currentUser &&
product.user_id===currentUser.id;


let phone=
String(product.phone||"")
.replace(/\D/g,"");


if(phone.startsWith("01")){
phone="20"+phone.substring(1);
}


return `

<div class="card">

<div class="card-top">

<div class="card-icon">
${product.icon || "📦"}
</div>

<div class="category-label">
${product.category || "أخرى"}
</div>

</div>


<div class="card-body">

<h3>
${escapeHTML(product.name)}
</h3>

<div class="price">
${Number(product.price||0).toLocaleString("ar-EG")}
<small>جنيه</small>
</div>

<div class="info">
📍 ${escapeHTML(product.location)}
</div>

<div class="info">
🏷️ ${escapeHTML(product.category)}
</div>


${
phone
?
`
<a
class="whatsapp"
href="https://wa.me/${phone}"
target="_blank">
💬 تواصل عبر واتساب
</a>
`
:""
}


${
owner
?
`
<button
class="delete"
onclick="deleteProduct('${product.id}')">
🗑️ حذف المنتج
</button>
`
:""
}

</div>

</div>

`;

}).join("");

}


function escapeHTML(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =========================
ADD PRODUCT
========================= */

function openProduct(){

if(!currentUser){

alert(
"لازم تسجل الدخول أولاً لإضافة منتج."
);

openAuth();

return;

}

productModal.style.display="flex";

}


function closeProduct(){

productModal.style.display="none";

}


async function publishProduct(){

if(!currentUser){

alert("لازم تسجل الدخول أولاً.");

return;

}


const name=
document.getElementById("productName")
.value.trim();

const price=
document.getElementById("productPrice")
.value;

const location=
document.getElementById("productLocation")
.value.trim();

const category=
document.getElementById("productCategory")
.value;

const icon=
document.getElementById("productIcon")
.value.trim() || "📦";

const phone=
document.getElementById("productPhone")
.value.trim();


if(!name ||
!price ||
!location ||
!category ||
!phone){

alert("من فضلك املأ كل البيانات.");

return;

}


const button=
document.getElementById("publishButton");

button.disabled=true;

button.textContent="⏳ جاري النشر...";


const {error}=
await supabaseClient
.from("products")
.insert({

name:name,
price:Number(price),
location:location,
category:category,
icon:icon,
phone:phone,
user_id:currentUser.id

});


button.disabled=false;

button.textContent="🚀 نشر المنتج";


if(error){

console.error(error);

alert(
"حدث خطأ أثناء نشر المنتج."
);

return;

}


document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productLocation").value="";
document.getElementById("productCategory").value="";
document.getElementById("productIcon").value="";
document.getElementById("productPhone").value="";


closeProduct();

showMessage(
"تم نشر المنتج بنجاح ✅",
"success"
);

loadProducts();

}


/* =========================
DELETE
========================= */

async function deleteProduct(id){

if(!currentUser){

alert("لازم تسجل الدخول.");

return;

}


if(!confirm("هل أنت متأكد من حذف المنتج؟")){

return;

}


const {error}=
await supabaseClient
.from("products")
.delete()
.eq("id",id);


if(error){

console.error(error);

showMessage(
