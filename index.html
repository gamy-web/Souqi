<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوقي</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#0d6efd;
  color:white;
  padding:15px;
  text-align:center;
}

header h1{
  margin:0 0 8px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.top-buttons{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 16px;
  cursor:pointer;
  font-size:15px;
}

.login-btn{
  background:white;
  color:#0d6efd;
}

.add-btn{
  background:#198754;
  color:white;
  flex:1;
}

.search-box{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:8px;
  margin-bottom:12px;
  font-size:16px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:15px;
}

.category-btn{
  background:white;
  border:1px solid #ddd;
  white-space:nowrap;
}

.category-btn.active{
  background:#0d6efd;
  color:white;
}

.msg{
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  display:none;
}

.msg.error{
  display:block;
  background:#f8d7da;
  color:#842029;
}

.msg.success{
  display:block;
  background:#d1e7dd;
  color:#0f5132;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-icon{
  font-size:45px;
  text-align:center;
  margin-bottom:10px;
}

.card h3{
  margin:5px 0;
}

.price{
  color:#198754;
  font-size:20px;
  font-weight:bold;
}

.location,
.category{
  color:#666;
  margin:7px 0;
}

.whatsapp{
  display:block;
  background:#25D366;
  color:white;
  text-decoration:none;
  text-align:center;
  padding:10px;
  border-radius:8px;
  margin-top:12px;
}

.empty{
  text-align:center;
  background:white;
  padding:30px;
  border-radius:10px;
  color:#777;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  border-radius:12px;
  padding:20px;
}

.modal-box h2{
  margin-top:0;
}

.modal-box input,
.modal-box select{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.save-btn{
  background:#198754;
  color:white;
  flex:1;
}

.cancel-btn{
  background:#6c757d;
  color:white;
  flex:1;
}
</style>
</head>

<body>

<header>
  <h1>🛒 سوقي</h1>
  <div>سوقك الإلكتروني البسيط</div>
</header>

<div class="container">

  <div class="top-buttons">
    <button class="login-btn" onclick="login()">تسجيل الدخول</button>
    <button class="add-btn" onclick="openModal()">➕ أضف منتج</button>
  </div>

  <input
    id="search"
    class="search-box"
    type="text"
    placeholder="🔍 ابحث عن منتج..."
    oninput="filterProducts()"
  >

  <div class="categories">
    <button class="category-btn active" onclick="selectCategory('الكل',this)">الكل</button>
    <button class="category-btn" onclick="selectCategory('إلكترونيات',this)">إلكترونيات</button>
    <button class="category-btn" onclick="selectCategory('ملابس',this)">ملابس</button>
    <button class="category-btn" onclick="selectCategory('أثاث',this)">أثاث</button>
    <button class="category-btn" onclick="selectCategory('سيارات',this)">سيارات</button>
    <button class="category-btn" onclick="selectCategory('أخرى',this)">أخرى</button>
  </div>

  <div id="status" class="msg"></div>

  <div id="products" class="products"></div>

</div>

<div id="modal" class="modal">
  <div class="modal-box">

    <h2>➕ إضافة منتج</h2>

    <input id="name" type="text" placeholder="اسم المنتج">

    <input id="price" type="number" placeholder="السعر">

    <input id="location" type="text" placeholder="المكان">

    <select id="category">
      <option value="">اختر القسم</option>
      <option value="إلكترونيات">إلكترونيات</option>
      <option value="ملابس">ملابس</option>
      <option value="أثاث">أثاث</option>
      <option value="سيارات">سيارات</option>
      <option value="أخرى">أخرى</option>
    </select>

    <input id="icon" type="text" placeholder="إيموجي المنتج مثل 📱">

    <input id="phone" type="text" placeholder="رقم واتساب">

    <div class="modal-buttons">
      <button class="save-btn" onclick="addProduct()">نشر المنتج</button>
      <button class="cancel-btn" onclick="closeModal()">إلغاء</button>
    </div>

  </div>
</div>

<script>

const SUPABASE_URL =
  "https://dbufhbeygczlfttdpinf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ffb08aL-n96nfgZZwjj3fw_KolUjymN";

let allProducts = [];
let selectedCategory = "الكل";


function showStatus(message,type){

  const status = document.getElementById("status");

  status.className = "msg " + type;
  status.textContent = message;

}


async function loadProducts(){

  const productsBox = document.getElementById("products");

  productsBox.innerHTML =
    '<div class="empty">جاري تحميل المنتجات...</div>';

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/products?select=*&order=created_at.desc",
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY
        }
      }
    );

    if(!response.ok){

      const errorText = await response.text();

      throw new Error(
        "HTTP " +
        response.status +
        " - " +
        errorText
      );

    }

    allProducts = await response.json();

    showStatus("", "");

    filterProducts();

  }catch(error){

    productsBox.innerHTML =
      '<div class="empty">لا توجد منتجات حالياً</div>';

    showStatus(
      "خطأ: " + error.message,
      "error"
    );

    console.error(error);

  }

}


function displayProducts(products){

  const box = document.getElementById("products");

  if(!products.length){

    box.innerHTML =
      '<div class="empty">لا توجد منتجات مطابقة للبحث</div>';

    return;
  }

  box.innerHTML = products.map(product => {

    const icon = product.icon || "📦";

    const phone = String(product.phone || "")
      .replace(/\s+/g,"")
      .replace(/^0+/,"");

    const whatsappNumber =
      phone.startsWith("20") ? phone : "20" + phone;

    return `

      <div class="card">

        <div class="card-icon">${escapeHtml(icon)}</div>

        <h3>${escapeHtml(product.name)}</h3>

        <div class="price">
          ${escapeHtml(product.price)} جنيه
        </div>

        <div class="location">
          📍 ${escapeHtml(product.location)}
        </div>

        <div class="category">
          🏷️ ${escapeHtml(product.category)}
        </div>

        <a
          class="whatsapp"
          href="https://wa.me/${whatsappNumber}"
          target="_blank"
        >
          💬 تواصل عبر واتساب
        </a>

      </div>

    `;

  }).join("");

}


function filterProducts(){

  const search =
    document.getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const filtered = allProducts.filter(product => {

    const matchesSearch =
      !search ||
      String(product.name).toLowerCase().includes(search) ||
      String(product.location).toLowerCase().includes(search) ||
      String(product.category).toLowerCase().includes(search);

    const matchesCategory =
      selectedCategory === "الكل" ||
      product.category === selectedCategory;

    return matchesSearch && matchesCategory;

  });

  displayProducts(filtered);

}


function selectCategory(category,button){

  selectedCategory = category;

  document
    .querySelectorAll(".category-btn")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  filterProducts();

}


function openModal(){

  document.getElementById("modal").style.display = "flex";

}


function closeModal(){

  document.getElementById("modal").style.display = "none";

}


async function addProduct(){

  const name =
    document.getElementById("name").value.trim();

  const price =
    document.getElementById("price").value.trim();

  const location =
    document.getElementById("location").value.trim();

  const category =
    document.getElementById("category").value;

  const icon =
    document.getElementById("icon").value.trim() || "📦";

  const phone =
    document.getElementById("phone").value.trim();

  if(!name || !price || !location || !category || !phone){

    alert("من فضلك املأ كل البيانات المطلوبة");

    return;
  }

  try{

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/products",
      {
        method:"POST",

        headers:{
          "apikey":SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=representation"
        },

        body:JSON.stringify({
          name:name,
          price:Number(price),
          location:location,
          category:category,
          icon:icon,
          phone:phone
        })

      }
    );

    if(!response.ok){

      const errorText = await response.text();

      throw new Error(
        "HTTP " +
        response.status +
        " - " +
        errorText
      );

    }

    showStatus(
      "تم نشر المنتج بنجاح ✅",
      "success"
    );

    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("location").value = "";
    document.getElementById("category").value = "";
    document.getElementById("icon").value = "";
    document.getElementById("phone").value = "";

    closeModal();

    await loadProducts();

  }catch(error){

    showStatus(
      "خطأ أثناء نشر المنتج: " + error.message,
      "error"
    );

    console.error(error);

  }

}


function login(){

  alert(
    "تسجيل الدخول سيتم تفعيله في الخطوة القادمة إن شاء الله."
  );

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


window.addEventListener("click",function(event){

  const modal =
    document.getElementById("modal");

  if(event.target === modal){

    closeModal();

  }

});


loadProducts();

</script>

</body>
</html>
