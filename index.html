<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سوقي</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#0d6efd;
  color:white;
  text-align:center;
  padding:30px 15px;
}

header h1{
  margin:0 0 10px;
  font-size:48px;
}

header p{
  margin:0;
  font-size:23px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.top{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:14px;
  font-size:17px;
  cursor:pointer;
}

.add-button{
  flex:1;
  background:#198754;
  color:white;
}

.login-button{
  flex:1;
  background:white;
  color:#0d6efd;
}

.user-box{
  display:none;
  background:white;
  border-radius:10px;
  padding:12px;
  margin-bottom:15px;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logout-button{
  background:#dc3545;
  color:white;
}

.search{
  width:100%;
  padding:16px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:18px;
  margin-bottom:12px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:10px;
}

.category{
  background:white;
  border:1px solid #ddd;
  white-space:nowrap;
}

.category.active{
  background:#0d6efd;
  color:white;
}

.message{
  display:none;
  padding:12px;
  border-radius:10px;
  margin:10px 0;
}

.message.success{
  display:block;
  background:#d1e7dd;
  color:#0f5132;
}

.message.error{
  display:block;
  background:#f8d7da;
  color:#842029;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:15px;
  padding:18px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.icon{
  text-align:center;
  font-size:55px;
  margin-bottom:10px;
}

.card h2{
  margin:5px 0 10px;
}

.price{
  color:#198754;
  font-size:22px;
  font-weight:bold;
  margin-bottom:8px;
}

.info{
  color:#666;
  margin:7px 0;
}

.whatsapp{
  display:block;
  text-align:center;
  background:#25d366;
  color:white;
  text-decoration:none;
  padding:13px;
  border-radius:10px;
  margin-top:12px;
  font-size:17px;
}

.delete{
  width:100%;
  background:#dc3545;
  color:white;
  margin-top:8px;
}

.empty{
  background:white;
  padding:30px;
  text-align:center;
  border-radius:12px;
  grid-column:1/-1;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:15px;
  padding:20px;
}

.modal-box h2{
  margin-top:0;
}

.input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:12px;
}

.save{
  flex:1;
  background:#198754;
  color:white;
}

.cancel{
  flex:1;
  background:#6c757d;
  color:white;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.tab{
  flex:1;
  background:#eee;
}

.tab.active{
  background:#0d6efd;
  color:white;
}

.auth-message{
  display:none;
  padding:10px;
  border-radius:8px;
  margin:10px 0;
}

.auth-message.error{
  display:block;
  background:#f8d7da;
  color:#842029;
}

.auth-message.success{
  display:block;
  background:#d1e7dd;
  color:#0f5132;
}

</style>
</head>


<body>


<header>

<h1>🛒 سوقي</h1>

<p>سوقك الإلكتروني البسيط</p>

</header>


<div class="container">


<div class="top">

<button
class="add-button"
id="addButton">

➕ أضف منتج

</button>


<button
class="login-button"
id="loginButton">

تسجيل الدخول

</button>

</div>


<div
class="user-box"
id="userBox">

<span id="userEmail"></span>

<button
class="logout-button"
id="logoutButton">

تسجيل الخروج

</button>

</div>


<input
class="search"
id="search"
placeholder="🔍 ابحث عن منتج...">


<div class="categories">

<button
class="category active"
data-category="الكل">

الكل

</button>


<button
class="category"
data-category="إلكترونيات">

إلكترونيات

</button>


<button
class="category"
data-category="ملابس">

ملابس

</button>


<button
class="category"
data-category="أثاث">

أثاث

</button>


<button
class="category"
data-category="سيارات">

سيارات

</button>


<button
class="category"
data-category="أخرى">

أخرى

</button>

</div>


<div
id="message"
class="message">
</div>


<div
id="products"
class="products">

<div class="empty">

جاري تحميل المنتجات...

</div>

</div>


</div>



<!-- تسجيل الدخول -->

<div
class="modal"
id="authModal">

<div class="modal-box">

<h2>👤 حساب سوقي</h2>


<div class="tabs">

<button
class="tab active"
id="loginTab">

تسجيل الدخول

</button>


<button
class="tab"
id="signupTab">

إنشاء حساب

</button>

</div>


<input
class="input"
id="email"
type="email"
placeholder="البريد الإلكتروني">


<input
class="input"
id="password"
type="password"
placeholder="كلمة المرور">


<input
class="input"
id="password2"
type="password"
placeholder="تأكيد كلمة المرور"
style="display:none;">


<div
class="auth-message"
id="authMessage">
</div>


<div class="modal-buttons">

<button
class="save"
id="authAction">

دخول

</button>


<button
class="cancel"
id="authCancel">

إلغاء

</button>

</div>

</div>

</div>



<!-- إضافة منتج -->

<div
class="modal"
id="productModal">

<div class="modal-box">

<h2>➕ إضافة منتج</h2>


<input
class="input"
id="productName"
placeholder="اسم المنتج">


<input
class="input"
id="productPrice"
type="number"
placeholder="السعر">


<input
class="input"
id="productLocation"
placeholder="المكان">


<select
class="input"
id="productCategory">

<option value="">
اختر القسم
</option>

<option value="إلكترونيات">
إلكترونيات
</option>

<option value="ملابس">
ملابس
</option>

<option value="أثاث">
أثاث
</option>

<option value="سيارات">
سيارات
</option>

<option value="أخرى">
أخرى
</option>

</select>


<input
class="input"
id="productIcon"
placeholder="إيموجي المنتج مثل 📱">


<input
class="input"
id="productPhone"
placeholder="رقم واتساب">


<div class="modal-buttons">

<button
class="save"
id="publishButton">

نشر المنتج

</button>


<button
class="cancel"
id="productCancel">

إلغاء

</button>

</div>

</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://dbufhbeygczlfttdpinf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ffb08aL-n96nfgZZwjj3fw_KolUjymN";


const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);



/* =========================
   المتغيرات
========================= */

let products = [];

let selectedCategory = "الكل";

let currentUser = null;

let authMode = "login";



/* =========================
   العناصر
========================= */

const productsBox =
document.getElementById("products");

const searchInput =
document.getElementById("search");

const messageBox =
document.getElementById("message");

const authModal =
document.getElementById("authModal");

const productModal =
document.getElementById("productModal");



/* =========================
   الرسائل
========================= */

function showMessage(text,type){

messageBox.textContent = text;

messageBox.className =
"message " + type;

}


function hideMessage(){

messageBox.style.display =
"none";

}



function showAuthMessage(text,type){

const box =
document.getElementById("authMessage");

box.textContent = text;

box.className =
"auth-message " + type;

}


function clearAuthMessage(){

const box =
document.getElementById("authMessage");

box.textContent = "";

box.className =
"auth-message";

}



/* =========================
   فتح وإغلاق
========================= */

document
.getElementById("addButton")
.addEventListener("click",function(){

if(!currentUser){

alert(
"لازم تسجل الدخول أولاً قبل إضافة منتج."
);

openAuth();

return;

}

productModal.style.display =
"flex";

});


document
.getElementById("productCancel")
.addEventListener("click",function(){

productModal.style.display =
"none";

});


document
.getElementById("loginButton")
.addEventListener("click",function(){

openAuth();

});


document
.getElementById("authCancel")
.addEventListener("click",function(){

authModal.style.display =
"none";

});


function openAuth(){

authModal.style.display =
"flex";

setLoginMode();

}



/* =========================
   تسجيل الدخول / إنشاء حساب
========================= */

document
.getElementById("loginTab")
.addEventListener("click",setLoginMode);


document
.getElementById("signupTab")
.addEventListener("click",setSignupMode);


function setLoginMode(){

authMode = "login";

document
.getElementById("loginTab")
.classList.add("active");

document
.getElementById("signupTab")
.classList.remove("active");

document
.getElementById("password2")
.style.display =
"none";

document
.getElementById("authAction")
.textContent =
"دخول";

clearAuthMessage();

}


function setSignupMode(){

authMode = "signup";

document
.getElementById("signupTab")
.classList.add("active");

document
.getElementById("loginTab")
.classList.remove("active");

document
.getElementById("password2")
.style.display =
"block";

document
.getElementById("authAction")
.textContent =
"إنشاء الحساب";

clearAuthMessage();

}



document
.getElementById("authAction")
.addEventListener(
"click",
async function(){

if(authMode === "login"){

await login();

}else{

await signup();

}

});



async function signup(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;

const password2 =
document
.getElementById("password2")
.value;


if(!email || !password || !password2){

showAuthMessage(
"اكتب كل البيانات.",
"error"
);

return;

}


if(password.length < 6){

showAuthMessage(
"كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
"error"
);

return;

}


if(password !== password2){

showAuthMessage(
"كلمتا المرور غير متطابقتين.",
"error"
);

return;

}


const {error} =
await supabaseClient.auth.signUp({

email:email,

password:password,

options:{
emailRedirectTo:
"https://gamy-web.github.io/Souqi/"
}

});


if(error){

showAuthMessage(
"خطأ: " + error.message,
"error"
);

return;

}


showAuthMessage(
"تم إنشاء الحساب ✅ افتح بريدك الإلكتروني وأكد الحساب.",
"success"
);

}



async function login(){

const email =
document
.getElementById("email")
.value
.trim();

const password =
document
.getElementById("password")
.value;


if(!email || !password){

showAuthMessage(
"اكتب البريد الإلكتروني وكلمة المرور.",
"error"
);

return;

}


const {error} =
await supabaseClient.auth
.signInWithPassword({

email:email,

password:password

});


if(error){

showAuthMessage(
"خطأ: " + error.message,
"error"
);

return;

}


authModal.style.display =
"none";

}



document
.getElementById("logoutButton")
.addEventListener(
"click",
async function(){

const {error} =
await supabaseClient.auth.signOut();


if(error){

alert(error.message);

return;

}

});



/* =========================
   المستخدم الحالي
========================= */

async function updateUser(){

const {data} =
await supabaseClient.auth.getUser();

currentUser =
data.user || null;


const userBox =
document.getElementById("userBox");

const loginButton =
document.getElementById("loginButton");

const userEmail =
document.getElementById("userEmail");


if(currentUser){

userBox.style.display =
"flex";

loginButton.style.display =
"none";

userEmail.textContent =
"👤 " + currentUser.email;

}else{

userBox.style.display =
"none";

loginButton.style.display =
"block";

}

renderProducts();

}



/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

productsBox.innerHTML =
'<div class="empty">جاري تحميل المنتجات...</div>';


const {data,error} =
await supabaseClient
.from("products")
.select("*")
.order("created_at",{
ascending:false
});


if(error){

productsBox.innerHTML =
'<div class="empty">حدث خطأ في تحميل المنتجات</div>';

showMessage(
"خطأ: " + error.message,
"error"
);

return;

}


products =
data || [];

renderProducts();

}



/* =========================
   عرض المنتجات
========================= */

function renderProducts(){

const search =
searchInput
.value
.trim()
.toLowerCase();


const filtered =
products.filter(function(product){

const text =
(
String(product.name || "") +
" " +
String(product.location || "") +
" " +
String(product.category || "")
)
.toLowerCase();


const searchOK =
!search ||
text.includes(search);


const categoryOK =
selectedCategory === "الكل" ||
product.category === selectedCategory;


return searchOK && categoryOK;

});


if(!filtered.length){

productsBox.innerHTML =
'<div class="empty">لا توجد منتجات</div>';

return;

}


productsBox.innerHTML =
filtered.map(function(product){

let phone =
String(product.phone || "")
.replace(/\s/g,"")
.replace(/^0+/,"");


if(!phone.startsWith("20")){

phone =
"20" + phone;

}


let deleteButton = "";


if(
currentUser &&
product.user_id &&
product.user_id === currentUser.id
){

deleteButton = `

<button
class="delete"
data-id="${product.id}">

🗑️ حذف المنتج

</button>

`;

}


return `

<div class="card">

<div class="icon">

${escapeHtml(product.icon || "📦")}

</div>


<h2>

${escapeHtml(product.name)}

</h2>


<div class="price">

${escapeHtml(product.price)}
 جنيه

</div>


<div class="info">

📍 ${escapeHtml(product.location)}

</div>


<div class="info">

🏷️ ${escapeHtml(product.category)}

</div>


<a
class="whatsapp"
href="https://wa.me/${phone}"
target="_blank">

💬 تواصل عبر واتساب

</a>


${deleteButton}

</div>

`;

}).join("");


document
.querySelectorAll(".delete")
.forEach(function(button){

button.addEventListener(
"click",
function(){

deleteProduct(
button.dataset.id
);

});

});

}



/* =========================
   حذف المنتج
========================= */

async function deleteProduct(id){

if(!currentUser){

alert(
"يجب تسجيل الدخول."
);

return;

}


const ok =
confirm(
"هل أنت متأكد من حذف المنتج؟"
);


if(!ok){

return;

}


const {error} =
await supabaseClient
.from("products")
.delete()
.eq("id",id)
.eq("user_id",currentUser.id);


if(error){

showMessage(
"خطأ أثناء الحذف: " +
error.message,
"error"
);

return;

}


showMessage(
"تم حذف المنتج بنجاح ✅",
"success"
);


await loadProducts();

}



/* =========================
   نشر المنتج
========================= */

document
.getElementById("publishButton")
.addEventListener(
"click",
addProduct
);


async function addProduct(){

if(!currentUser){

alert(
"لازم تسجل الدخول أولاً."
);

productModal.style.display =
"none";

openAuth();

return;

}


const name =
document
.getElementById("productName")
.value
.trim();


const price =
document
.getElementById("productPrice")
.value
.trim();


const location =
document
.getElementById("productLocation")
.value
.trim();


const category =
document
.getElementById("productCategory")
.value;


const icon =
document
.getElementById("productIcon")
.value
.trim() ||
"📦";


const phone =
document
.getElementById("productPhone")
.value
.trim();


if(
!name ||
!price ||
!location ||
!category ||
!phone
){

alert(
"املأ كل بيانات المنتج."
);

return;

}


const {error} =
await supabaseClient
.from("products")
.insert({

name:name,

price:Number(price),

location:location,

category:category,

icon:icon,

phone:phone,

user_id:currentUser.id

});


if(error){

showMessage(
"خطأ أثناء نشر المنتج: " +
error.message,
"error"
);

return;

}


showMessage(
"تم نشر المنتج بنجاح ✅",
"success"
);


document
.getElementById("productName")
.value = "";

document
.getElementById("productPrice")
.value = "";

document
.getElementById("productLocation")
.value = "";

document
.getElementById("productCategory")
.value = "";

document
.getElementById("productIcon")
.value = "";

document
.getElementById("productPhone")
.value = "";


productModal.style.display =
"none";


await loadProducts();

}



/* =========================
   البحث
========================= */

searchInput
.addEventListener(
"input",
renderProducts
);



/* =========================
   الأقسام
========================= */

document
.querySelectorAll(".category")
.forEach(function(button){

button.addEventListener(
"click",
function(){

document
.querySelectorAll(".category")
.forEach(function(b){

b.classList.remove("active");

});


button.classList.add("active");

selectedCategory =
button.dataset.category;

renderProducts();

});

});



/* =========================
   حماية النص
========================= */

function escapeHtml(value){

return String(value)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}



/* =========================
   مراقبة الحساب
========================= */

supabaseClient.auth
.onAuthStateChange(
function(){

updateUser();

});



/* =========================
   تشغيل الموقع
========================= */

async function start(){

await updateUser();

await loadProducts();

}


start();


</script>

</body>
  </html>
