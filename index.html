/* =========================================
   HELPERS
========================================= */

function showElement(element) {
  if (element) {
    element.classList.add("show");
  }
}

function hideElement(element) {
  if (element) {
    element.classList.remove("show");
  }
}

function showError(element, message) {
  if (!element) return;

  element.textContent = message;
  element.style.display = "block";
}

function hideError(element) {
  if (!element) return;

  element.textContent = "";
  element.style.display = "none";
}

function showSuccess(element, message) {
  if (!element) return;

  element.textContent = message;
  element.style.display = "block";
}

function hideSuccess(element) {
  if (!element) return;

  element.textContent = "";
  element.style.display = "none";
}

function formatPrice(price) {
  const number = Number(price);

  if (Number.isNaN(number)) {
    return price || "السعر غير محدد";
  }

  return number.toLocaleString("ar-EG") + " جنيه";
}

/* =========================================
   AUTH ACTION
========================================= */

async function handleAuth() {

  hideError(authError);
  hideSuccess(authSuccess);

  const email =
    emailInput ? emailInput.value.trim() : "";

  const password =
    passwordInput ? passwordInput.value : "";

  if (!email) {
    showError(authError, "اكتب البريد الإلكتروني.");
    return;
  }

  if (!password) {
    showError(authError, "اكتب كلمة المرور.");
    return;
  }

  if (isSignup) {

    const confirmPassword =
      confirmPasswordInput
        ? confirmPasswordInput.value
        : "";

    if (password !== confirmPassword) {
      showError(
        authError,
        "كلمتا المرور غير متطابقتين."
      );
      return;
    }

    if (password.length < 6) {
      showError(
        authError,
        "كلمة المرور يجب أن تكون 6 أحرف على الأقل."
      );
      return;
    }

    if (!supabaseClient) {
      showError(
        authError,
        "خدمة الحسابات غير متاحة حاليًا. حاول مرة أخرى."
      );
      return;
    }

    try {

      authAction.disabled = true;
      authAction.textContent = "جاري الإنشاء...";

      const result =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if (result.error) {
        throw result.error;
      }

      showSuccess(
        authSuccess,
        "تم إنشاء الحساب. افحص بريدك الإلكتروني إذا طُلب منك تأكيد الحساب."
      );

    } catch (error) {

      console.error(error);

      showError(
        authError,
        error.message || "حدث خطأ أثناء إنشاء الحساب."
      );

    } finally {

      authAction.disabled = false;
      authAction.textContent = "إنشاء حساب";
    }

    return;
  }


  if (!supabaseClient) {
    showError(
      authError,
      "خدمة تسجيل الدخول غير متاحة حاليًا."
    );
    return;
  }

  try {

    authAction.disabled = true;
    authAction.textContent = "جاري الدخول...";

    const result =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (result.error) {
      throw result.error;
    }

    currentUser = result.data.user;

    updateUserUI();

    closeLoginModal();

  } catch (error) {

    console.error(error);

    showError(
      authError,
      error.message || "البريد الإلكتروني أو كلمة المرور غير صحيحة."
    );

  } finally {

    authAction.disabled = false;
    authAction.textContent = "دخول";
  }
}

/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts() {

  if (!productsGrid) return;

  productsGrid.innerHTML = `
    <div class="loading">
      ⏳<br><br>
      جاري تحميل المنتجات...
    </div>
  `;

  let products = null;


  if (supabaseClient) {

    try {

      const request =
        supabaseClient
          .from("products")
          .select("*")
          .order(
            "created_at",
            { ascending: false }
          );

      const timeout =
        new Promise((resolve) => {
          setTimeout(() => {
            resolve({
              data: null,
              error: {
                message: "timeout"
              }
            });
          }, 5000);
        });

      const result =
        await Promise.race([
          request,
          timeout
        ]);

      if (
        result &&
        !result.error &&
        Array.isArray(result.data)
      ) {
        products = result.data;
      }

    } catch (error) {

      console.error(
        "Products Error:",
        error
      );
    }
  }


  if (!products) {
    products = getDemoProducts();
  }

  allProducts = products;

  renderProducts();
}


/* =========================================
   RENDER PRODUCTS
========================================= */

function renderProducts() {

  if (!productsGrid) return;

  const search =
    searchInput
      ? searchInput.value.trim().toLowerCase()
      : "";


  let filtered =
    allProducts.filter((product) => {

      const category =
        product.category ||
        product.product_category ||
        "أخرى";

      const name =
        product.name ||
        product.title ||
        product.product_name ||
        "";

      const location =
        product.location ||
        product.city ||
        "";

      const matchesCategory =
        selectedCategory === "الكل" ||
        category === selectedCategory;

      const searchableText =
        (
          name +
          " " +
          category +
          " " +
          location
        ).toLowerCase();

      const matchesSearch =
        !search ||
        searchableText.includes(search);

      return (
        matchesCategory &&
        matchesSearch
      );
    });


  if (!filtered.length) {

    productsGrid.innerHTML = `
      <div class="empty">
        لا توجد منتجات مطابقة للبحث.
      </div>
    `;

    return;
  }


  productsGrid.innerHTML =
    filtered
      .map((product) => {

        const id =
          product.id || "";

        const name =
          product.name ||
          product.title ||
          product.product_name ||
          "منتج";

        const price =
          product.price ??
          product.product_price ??
          "";

        const location =
          product.location ||
          product.city ||
          "غير محدد";

        const category =
          product.category ||
          product.product_category ||
          "أخرى";

        const emoji =
          product.emoji ||
          product.product_emoji ||
          "📦";

        const whatsapp =
          product.whatsapp ||
          product.phone ||
          product.product_whatsapp ||
          "";

        let contactButton = "";

        if (whatsapp) {

          const cleanNumber =
            String(whatsapp)
              .replace(/\D/g, "");

          contactButton = `
            <button
              class="btn btn-primary"
              onclick="contactWhatsapp('${cleanNumber}')"
            >
              واتساب
            </button>
          `;

        } else {

          contactButton = `
            <button
              class="btn btn-light"
              onclick="showContactMessage()"
            >
              تواصل
            </button>
          `;
        }


        return `
          <div class="product-card">

            <div class="product-image">
              ${escapeHtml(emoji)}
            </div>

            <div class="product-body">

              <span class="product-category">
                ${escapeHtml(category)}
              </span>

              <h3 class="product-title">
                ${escapeHtml(name)}
              </h3>

              <div class="product-price">
                ${formatPrice(price)}
              </div>

              <div class="product-location">
                📍 ${escapeHtml(location)}
              </div>

              <div class="product-actions">

                ${contactButton}

                ${
                  currentUser
                    ? `
                      <button
                        class="btn btn-light"
                        onclick="deleteProduct('${id}')"
                      >
                        حذف
                      </button>
                    `
                    : ""
                }

              </div>

            </div>

          </div>
        `;
      })
      .join("");
}


/* =========================================
   HTML SAFE
========================================= */

function escapeHtml(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================
   WHATSAPP
========================================= */

function contactWhatsapp(number) {

  if (!number) {
    showContactMessage();
    return;
  }

  const url =
    "https://wa.me/" +
    number;

  window.open(
    url,
    "_blank"
  );
}


function showContactMessage() {

  alert(
    "رقم التواصل غير متوفر لهذا المنتج."
  );
}


/* =========================================
   CATEGORY FILTER
========================================= */

function setupCategories() {

  const categories =
    document.querySelectorAll(
      ".category"
    );

  categories.forEach((button) => {

    button.addEventListener(
      "click",
      function () {

        categories.forEach((item) => {
          item.classList.remove("active");
        });

        this.classList.add("active");

        selectedCategory =
          this.dataset.category ||
          "الكل";

        renderProducts();
      }
    );
  });
}

    showError(
      authError,
      "يجب تسجيل الدخول أولًا لإضافة منتج."

    return;
  }


  const name =
    productName
      ? productName.value.trim()
      : "";

  const price =
    productPrice
      ? productPrice.value
      : "";

  const location =
    productLocation
      ? productLocation.value.trim()
      : "";

  const category =
    productCategory
      ? productCategory.value
      : "أخرى";

  const emoji =
    productEmoji &&
    productEmoji.value.trim()
      ? productEmoji.value.trim()
      : "📦";

  const whatsapp =
    productWhatsapp
      ? productWhatsapp.value.trim()
      : "";


  if (!name) {
    showError(
      productError,
      "اكتب اسم المنتج."
    );
    return;
  }

  if (!price) {
    showError(
      productError,
      "اكتب سعر المنتج."
    );
    return;
  }

  if (!location) {
    showError(
      productError,
      "اكتب المكان."
    );
    return;
  }


  if (!supabaseClient) {

    showError(
      productError,
      "قاعدة البيانات غير متاحة حاليًا."
    );

    return;
  }


  try {

    publishButton.disabled = true;
    publishButton.textContent =
      "جاري النشر...";


    const productData = {
      name: name,
      price: Number(price),
      location: location,
      category: category,
      emoji: emoji,
      whatsapp: whatsapp,
      user_id: currentUser.id
    };


    const result =
      await supabaseClient
        .from("products")
        .insert(productData);


    if (result.error) {
      throw result.error;
    }


    showSuccess(
      productSuccess,
      "تم نشر المنتج بنجاح."
    );


    if (productName) {
      productName.value = "";
    }

    if (productPrice) {
      productPrice.value = "";
    }

    if (productLocation) {
      productLocation.value = "";
    }

    if (productEmoji) {
      productEmoji.value = "";
    }

    if (productWhatsapp) {
      productWhatsapp.value = "";
    }


    await loadProducts();


    setTimeout(() => {
      closeProductModal();
    }, 1000);


  } catch (error) {

    console.error(
      "Publish Error:",
      error
    );

    showError(
      productError,
      error.message ||
      "حدث خطأ أثناء نشر المنتج."
    );

  } finally {

    publishButton.disabled = false;
    publishButton.textContent =
      "🚀 نشر المنتج";
  }
}

    return;
  }


  try {

    const result =
      await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);


    if (result.error) {
