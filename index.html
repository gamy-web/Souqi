<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوقي | سوقك الإلكتروني</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7f9;color:#17202a}
button,input,select{font-family:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-bottom:1px solid #e5e7eb}
.header{max-width:1200px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:10px}
.logo{margin-left:auto;font-size:24px;font-weight:900;color:#087f5b;text-decoration:none}
.actions{display:flex;gap:8px}
.btn{border:0;padding:11px 16px;border-radius:12px;font-weight:800;transition:.2s}
.btn:hover{transform:translateY(-1px)}
.primary{background:#087f5b;color:#fff}
.light{background:#eef5f2;color:#087f5b}
.danger{background:#fee2e2;color:#b91c1c}
.container{max-width:1200px;margin:auto;padding:0 18px}
.hero{margin-top:25px;border-radius:25px;padding:45px 30px;background:linear-gradient(135deg,#087f5b,#075c45);color:#fff}
.hero h1{margin:0 0 12px;font-size:42px}
.hero p{margin:0 0 22px;line-height:1.9;font-size:17px}
.hero-buttons{display:flex;gap:10px;flex-wrap:wrap}
.hero .primary{background:#fff;color:#087f5b}
.hero .light{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.25)}
.user{display:none;margin-top:18px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:14px;align-items:center;gap:10px}
.user.show{display:flex}
.usericon{font-size:25px}
.userinfo{flex:1}
.search{margin-top:22px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:7px 14px;display:flex;gap:8px;align-items:center}
.search input{width:100%;border:0;outline:0;padding:12px;font-size:16px}
.section{margin-top:32px}
.title{margin-bottom:14px}
.title h2{margin:0}
.categories{display:flex;gap:9px;flex-wrap:wrap}
.category{border:1px solid #dfe5e3;background:#fff;padding:11px 15px;border-radius:13px;font-weight:700}
.category.active{background:#087f5b;color:#fff;border-color:#087f5b}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden}
.pic{height:170px;background:#eef3f1;display:flex;align-items:center;justify-content:center;font-size:65px}
.body{padding:14px}
.tag{display:inline-block;background:#eef7f3;color:#087f5b;padding:5px 8px;border-radius:8px;font-size:12px;font-weight:700;margin-bottom:9px}
.name{margin:0 0 7px;font-size:17px}
.price{color:#087f5b;font-size:18px;font-weight:900;margin-bottom:6px}
.loc{color:#6b7280;font-size:13px;margin-bottom:12px}
.cardactions{display:flex;gap:7px}
.cardactions .btn{flex:1;padding:9px 8px}
.loading,.empty{background:#fff;border:1px dashed #d1d5db;border-radius:16px;padding:40px;text-align:center;color:#6b7280;grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.55);padding:18px;align-items:center;justify-content:center}
.modal.show{display:flex}
.box{width:100%;max-width:500px;max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:23px;position:relative}
.close{position:absolute;left:15px;top:12px;border:0;background:#f3f4f6;width:38px;height:38px;border-radius:50%;font-size:22px}
.box h2{margin:0 0 18px}
.tabs{display:flex;background:#f3f5f4;padding:5px;border-radius:11px;margin-bottom:18px}
.tab{flex:1;border:0;padding:10px;border-radius:8px;background:transparent;font-weight:800}
.tab.active{background:#fff;color:#087f5b}
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:6px;font-weight:700;font-size:14px}
.field input,.field select{width:100%;border:1px solid #d9dfdd;border-radius:11px;padding:12px;outline:0;font-size:15px;background:#fff}
.modalactions{display:flex;gap:9px;margin-top:18px}
.modalactions .btn{flex:1}
.error,.success{display:none;padding:10px;border-radius:9px;margin-bottom:13px;font-size:14px}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
footer{margin-top:55px;background:#10251f;color:#fff;padding:30px 18px}
.footer{max-width:1200px;margin:auto}
.footlogo{font-size:23px;font-weight:900;color:#6ee7b7}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:34px}}
@media(max-width:500px){.container{padding:0 12px}.grid{grid-template-columns:1fr}.hero{padding:32px 20px}.hero h1{font-size:30px}.actions .primary{display:none}.cardactions{flex-direction:column}}
</style>
</head>
<body>

<header>
<div class="header">
<a class="logo" href="#">🛒 سوقي</a>
<div class="actions">
<button id="addButton" class="btn primary">＋ أضف منتج</button>
<button id="loginButton" class="btn light">👤 دخول</button>
<button id="logoutButton" class="btn danger" style="display:none">تسجيل الخروج</button>
</div>
</div>
</header>

<main class="container">

<section class="hero">
<h1>بيع واشتري بسهولة</h1>
<p>اكتشف المنتجات المعروضة حولك، وانشر منتجاتك ليشوفها الجميع ويتواصلوا معك مباشرة.</p>
<div class="hero-buttons">
<button id="heroAdd" class="btn primary">🛍️ أضف منتجك الآن</button>
<button id="heroBrowse" class="btn light">🔎 تصفح المنتجات</button>
</div>
</section>

<div id="userBar" class="user">
<div class="usericon">👤</div>
<div class="userinfo">
<strong id="userName">مرحبًا بك</strong>
<small id="userEmail"></small>
</div>
</div>

<section class="search">
<span>🔍</span>
<input id="searchInput" type="text" placeholder="ابحث عن منتج، قسم، أو مكان...">
</section>

<section class="section">
<div class="title"><h2>تصفح الأقسام</h2></div>
<div class="categories">
<button class="category active" data-cat="الكل">الكل</button>
<button class="category" data-cat="إلكترونيات">📱 إلكترونيات</button>
<button class="category" data-cat="ملابس">👕 ملابس</button>
<button class="category" data-cat="أثاث">🪑 أثاث</button>
<button class="category" data-cat="سيارات">🚗 سيارات</button>
<button class="category" data-cat="أخرى">📦 أخرى</button>
</div>
</section>

<section id="productsSection" class="section">
<div class="title"><h2>أحدث المنتجات</h2></div>
<div id="productsGrid" class="grid">
<div class="loading">⏳<br><br>جاري تحميل المنتجات...</div>
</div>
</section>

</main>

<footer>
<div class="footer">
<div class="footlogo">🛒 سوقي</div>
<div>سوقك الإلكتروني البسيط</div>
</div>
</footer>

<div id="authModal" class="modal">
<div class="box">

<button class="close" id="authClose">×</button>
<h2>👤 حساب سوقي</h2>

<div class="tabs">
<button id="loginTab" class="tab active">تسجيل الدخول</button>
<button id="signupTab" class="tab">إنشاء حساب</button>
</div>

<div id="authError" class="error"></div>
<div id="authSuccess" class="success"></div>

<div class="field">
<label>البريد الإلكتروني</label>
<input id="emailInput" type="email" placeholder="example@email.com">
</div>

<div class="field">
<label>كلمة المرور</label>
<input id="passwordInput" type="password" placeholder="كلمة المرور">
</div>

<div id="confirmField" class="field" style="display:none">
<label>تأكيد كلمة المرور</label>
<input id="confirmInput" type="password" placeholder="أعد كتابة كلمة المرور">
</div>

<div class="modalactions">
<button id="authAction" class="btn primary">دخول</button>
<button id="authCancel" class="btn light">إلغاء</button>
</div>

</div>
</div>

<div id="productModal" class="modal">
<div class="box">

<button class="close" id="productClose">×</button>
<h2>🛍️ أضف منتجًا</h2>

<div id="productError" class="error"></div>
<div id="productSuccess" class="success"></div>

<div class="field">
<label>اسم المنتج</label>
<input id="productName" placeholder="مثال: هاتف سامسونج">
</div>

<div class="field">
<label>السعر بالجنيه</label>
<input id="productPrice" type="number" min="0" placeholder="مثال: 8500">
</div>

<div class="field">
<label>المكان</label>
<input id="productLocation" placeholder="مثال: الزقازيق">
</div>

<div class="field">
<label>القسم</label>
<select id="productCategory">
<option>إلكترونيات</option>
<option>ملابس</option>
<option>أثاث</option>
<option>سيارات</option>
<option>أخرى</option>
</select>
</div>

<div class="field">
<label>رمز المنتج</label>
<input id="productEmoji" maxlength="4" placeholder="📱">
</div>

<div class="field">
<label>رقم واتساب</label>
<input id="productWhatsapp" type="tel" placeholder="2010xxxxxxxx">
</div>

<div class="modalactions">
<button id="publishButton" class="btn primary">🚀 نشر المنتج</button>
<button id="productCancel" class="btn light">إلغاء</button>
</div>

</div>
</div>

<script>
const SUPABASE_URL="https://dbufhbeygczlfttdpinf.supabase.co";
const SUPABASE_KEY="sb_publishable_ffb08aL-n96nfgZZwjj3fw_KolUjymN";

let db=null,currentUser=null,isSignup=false,products=[],cat="الكل";

try{
if(window.supabase?.createClient){
db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
}
}catch(e){
console.error(e);
}

const $=id=>document.getElementById(id);
const authModal=$("authModal");
const productModal=$("productModal");

function show(el){
el.classList.add("show");
}

function hide(el){
el.classList.remove("show");
}

function msg(el,text,type="error"){
el.textContent=text;
el.style.display="block";
el.className=type;
}

function clearMsg(el){
el.textContent="";
el.style.display="none";
}

function price(v){
return Number(v||0).toLocaleString("ar-EG")+" جنيه";
}

function safe(v){
return String(v??"").replace(/[&<>"']/g,m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m]));
}

function demo(){
return[
{id:"d1",name:"هاتف سامسونج",price:8500,location:"الزقازيق",category:"إلكترونيات",emoji:"📱"},
{id:"d2",name:"كرسي مكتب",price:1800,location:"الزقازيق",category:"أثاث",emoji:"🪑"},
{id:"d3",name:"جاكيت رجالي",price:950,location:"الشرقية",category:"ملابس",emoji:"👕"},
{id:"d4",name:"سيارة مستعملة",price:350000,location:"الزقازيق",category:"سيارات",emoji:"🚗"}
];
}

function render(){

let q=$("searchInput").value.trim().toLowerCase();

let list=products.filter(p=>{

let name=p.name||p.title||"";
let c=p.category||p.product_category||"أخرى";
let l=p.location||p.city||"";

return(
(cat==="الكل"||c===cat)&&
(!q||(name+" "+c+" "+l).toLowerCase().includes(q))
);

});

if(!list.length){

$("productsGrid").innerHTML=
'<div class="empty">لا توجد منتجات مطابقة.</div>';

return;
}

$("productsGrid").innerHTML=list.map(p=>{

let name=safe(p.name||p.title||"منتج");
let c=safe(p.category||"أخرى");
let loc=safe(p.location||"غير محدد");
let em=safe(p.emoji||"📦");
let wa=p.whatsapp||p.phone||"";

let contact=wa?
`<button class="btn primary" onclick="whatsapp('${String(wa).replace(/\D/g,"")}')">واتساب</button>`:
`<button class="btn light" onclick="alert('رقم التواصل غير متوفر لهذا المنتج')">تواصل</button>`;

return`
<div class="card">
<div class="pic">${em}</div>
<div class="body">
<span class="tag">${c}</span>
<h3 class="name">${name}</h3>
<div class="price">${price(p.price)}</div>
<div class="loc">📍 ${loc}</div>
<div class="cardactions">${contact}</div>
</div>
</div>
`;

}).join("");

}

window.whatsapp=n=>{
if(n){
window.open("https://wa.me/"+n,"_blank");
}
};

async function loadProducts(){

$("productsGrid").innerHTML=
'<div class="loading">⏳<br><br>جاري تحميل المنتجات...</div>';

if(db){

try{

let result=await Promise.race([

db.from("products")
.select("*")
.order("created_at",{ascending:false}),

new Promise(r=>setTimeout(()=>r({error:true}),5000))

]);

if(!result.error&&Array.isArray(result.data)){
products=result.data;
}else{
products=demo();
}

}catch(e){
products=demo();
}

}else{
products=demo();
}

render();
}

function updateUser(){

$("userBar").classList.toggle("show",!!currentUser);

$("loginButton").style.display=currentUser?"none":"";

$("logoutButton").style.display=currentUser?"":"none";

if(currentUser){

$("userName").textContent=
currentUser.email||"مستخدم سوقي";

$("userEmail").textContent=
currentUser.email||"";

}
}

function openAuth(){

clearMsg($("authError"));
clearMsg($("authSuccess"));
show(authModal);

}

function openProduct(){

if(!currentUser){

openAuth();

msg(
$("authError"),
"سجل الدخول أولًا لإضافة منتج."
);

return;
}

clearMsg($("productError"));
clearMsg($("productSuccess"));
show(productModal);

}

$("loginButton").onclick=openAuth;
$("addButton").onclick=openProduct;
$("heroAdd").onclick=openProduct;

$("heroBrowse").onclick=()=>
$("productsSection").scrollIntoView({
behavior:"smooth"
});

$("authClose").onclick=()=>
hide(authModal);

$("authCancel").onclick=()=>
hide(authModal);

$("productClose").onclick=()=>
hide(productModal);

$("productCancel").onclick=()=>
hide(productModal);

$("searchInput").oninput=render;

document.querySelectorAll(".category").forEach(b=>{

b.onclick=()=>{

document.querySelectorAll(".category")
.forEach(x=>x.classList.remove("active"));

b.classList.add("active");

cat=b.dataset.cat;

render();

};

});

$("loginTab").onclick=()=>{

isSignup=false;

$("loginTab").classList.add("active");
$("signupTab").classList.remove("active");

$("confirmField").style.display="none";

$("authAction").textContent="دخول";

clearMsg($("authError"));
clearMsg($("authSuccess"));

};

$("signupTab").onclick=()=>{

isSignup=true;

$("signupTab").classList.add("active");
$("loginTab").classList.remove("active");

$("confirmField").style.display="block";

$("authAction").textContent="إنشاء حساب";

clearMsg($("authError"));
clearMsg($("authSuccess"));

};

$("authAction").onclick=async()=>{

clearMsg($("authError"));
clearMsg($("authSuccess"));

let email=$("emailInput").value.trim();
let pass=$("passwordInput").value;

if(!email||!pass){

msg(
$("authError"),
"اكتب البريد الإلكتروني وكلمة المرور."
);

return;
}

if(!db){

msg(
$("authError"),
"خدمة الحسابات غير متاحة حاليًا."
);

return;
}

try{

$("authAction").disabled=true;

if(isSignup){

if(pass!==$("confirmInput").value){

msg(
$("authError"),
"كلمتا المرور غير متطابقتين."
);

return;
}

let r=await db.auth.signUp({
email:email,
password:pass
});

if(r.error)throw r.error;

msg(
$("authSuccess"),
"تم إنشاء الحساب. افحص بريدك إذا طُلب التأكيد.",
"success"
);

}else{

let r=await db.auth.signInWithPassword({
email:email,
password:pass
});

if(r.error)throw r.error;

currentUser=r.data.user;

updateUser();

hide(authModal);

}

}catch(e){

msg(
$("authError"),
e.message||"حدث خطأ أثناء تسجيل الدخول."
);

}finally{

$("authAction").disabled=false;

}

};

$("logoutButton").onclick=async()=>{

try{

if(db)
await db.auth.signOut();

}catch(e){}

currentUser=null;

updateUser();

};

$("publishButton").onclick=async()=>{

clearMsg($("productError"));
clearMsg($("productSuccess"));

if(!currentUser){

hide(productModal);
openAuth();

return;
}

if(!db){

msg(
$("productError"),
"قاعدة البيانات غير متاحة حاليًا."
);

return;
}

let data={

name:$("productName").value.trim(),

price:Number(
$("productPrice").value
),

location:$("productLocation").value.trim(),

category:$("productCategory").value,

emoji:$("productEmoji").value.trim()||"📦",

whatsapp:$("productWhatsapp").value.trim(),

user_id:currentUser.id

};

if(!data.name||!data.price||!data.location){

msg(
$("productError"),
"أكمل اسم المنتج والسعر والمكان."
);

return;
}

try{

$("publishButton").disabled=true;

let r=await db
.from("products")
.insert(data);

if(r.error)throw r.error;

msg(
$("productSuccess"),
"تم نشر المنتج بنجاح.",
"success"
);

await loadProducts();

setTimeout(
()=>hide(productModal),
900
);

}catch(e){

msg(
$("productError"),
e.message||"حدث خطأ أثناء النشر."
);

}finally{

$("publishButton").disabled=false;

}

};

[authModal,productModal].forEach(m=>{

m.onclick=e=>{

if(e.target===m)
hide(m);

};

});

async function start(){

updateUser();

if(db){

try{

let r=await db.auth.getSession();

currentUser=
r.data?.session?.user||null;

updateUser();

db.auth.onAuthStateChange(
(_e,s)=>{

currentUser=s?.user||null;

updateUser();

}
);

}catch(e){}

}

await loadProducts();

}

start();
</script>

</body>
   </html>
