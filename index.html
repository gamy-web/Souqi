<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>سوقي | سوقك الإلكتروني</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f9;
      color: #17202a;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255,255,255,.96);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      margin-left: auto;
      font-size: 28px;
      font-weight: 900;
      color: #087f5b;
      text-decoration: none;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      border: 0;
      padding: 11px 17px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: #087f5b;
      color: white;
    }

    .btn-primary:hover {
      background: #066b4c;
    }

    .btn-light {
      background: #eef5f2;
      color: #087f5b;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }

    /* =========================
       HERO
    ========================= */

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px;
    }

    .hero {
      margin-top: 28px;
      border-radius: 28px;
      padding: 55px 35px;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,.18), transparent 35%),
        linear-gradient(135deg, #087f5b, #075c45);
      color: white;
      overflow: hidden;
      position: relative;
    }

    .hero h1 {
      margin: 0 0 15px;
      font-size: 46px;
      line-height: 1.2;
    }

    .hero p {
      margin: 0 0 25px;
      font-size: 18px;
      line-height: 1.9;
      max-width: 700px;
      opacity: .95;
    }

    .hero-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero .btn-primary {
      background: white;
      color: #087f5b;
    }

    .hero .btn-light {
      background: rgba(255,255,255,.14);
      color: white;
      border: 1px solid rgba(255,255,255,.25);
    }

    /* =========================
       USER BAR
    ========================= */

    .user-bar {
      display: none;
      margin-top: 18px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      padding: 15px 18px;
      align-items: center;
      gap: 12px;
    }

    .user-bar.show {
      display: flex;
    }

    .user-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #e8f5f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .user-info {
      flex: 1;
    }

    .user-info strong {
      display: block;
    }

    .user-info small {
      color: #6b7280;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-section {
      margin-top: 25px;
    }

    .search-box {
      background: white;
      border-radius: 18px;
      border: 1px solid #e5e7eb;
      padding: 8px 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-box span {
      font-size: 22px;
    }

    .search-box input {
      flex: 1;
      border: 0;
      outline: 0;
      font-size: 16px;
      padding: 13px 5px;
      background: transparent;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      margin-top: 35px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 24px;
    }

    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .category {
      border: 1px solid #dfe5e3;
      background: white;
      color: #26332f;
      padding: 12px 17px;
      border-radius: 14px;
      font-weight: 700;
      transition: .2s;
    }

    .category:hover {
      border-color: #087f5b;
      color: #087f5b;
    }

    .category.active {
      background: #087f5b;
      color: white;
      border-color: #087f5b;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .product-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      transition: .25s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(0,0,0,.08);
    }

    .product-image {
      height: 190px;
      background: #eef3f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
    }

    .product-body {
      padding: 16px;
    }

    .product-title {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .product-price {
      color: #087f5b;
      font-size: 19px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .product-location {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .product-category {
      display: inline-block;
      background: #eef7f3;
      color: #087f5b;
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
    }

    .product-actions .btn {
      flex: 1;
    }

    .loading,
    .empty {
      background: white;
      border: 1px dashed #d1d5db;
      border-radius: 18px;
      padding: 45px 20px;
      text-align: center;
      color: #6b7280;
      grid-column: 1 / -1;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3000;
      background: rgba(0,0,0,.55);
      padding: 20px;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      border-radius: 24px;
      padding: 25px;
      position: relative;
      box-shadow: 0 25px 80px rgba(0,0,0,.2);
    }

    .modal-close {
      position: absolute;
      left: 18px;
      top: 15px;
      border: 0;
      background: #f3f4f6;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 22px;
    }

    .modal-box h2 {
      margin: 0 0 22px;
    }

    .tabs {
      display: flex;
      background: #f3f5f4;
      padding: 5px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      border: 0;
      padding: 11px;
      border-radius: 9px;
      background: transparent;
      font-weight: 800;
    }

    .tab.active {
      background: white;
      color: #087f5b;
      box-shadow: 0 2px 8px rgba(0,0,0,.05);
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      font-size: 14px;
    }

    .field input,
    .field select {
      width: 100%;
      border: 1px solid #d9dfdd;
      border-radius: 12px;
      padding: 13px;
      outline: none;
      font-size: 15px;
      background: white;
    }

    .field input:focus,
    .field select:focus {
      border-color: #087f5b;
      box-shadow: 0 0 0 3px rgba(8,127,91,.08);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    .error-message {
      display: none;
      background: #fee2e2;
      color: #991b1b;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .success-message {
      display: none;
      background: #dcfce7;
      color: #166534;
      padding: 11px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 60px;
      background: #10251f;
      color: white;
      padding: 35px 20px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .footer-logo {
      font-size: 25px;
      font-weight: 900;
      color: #6ee7b7;
    }

    .footer-text {
      color: #b8c6c1;
      margin-top: 8px;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .hero h1 {
        font-size: 38px;
      }
    }

    @media (max-width: 700px) {
      .header-inner {
        padding: 12px;
      }

      .logo {
        font-size: 23px;
      }

      .header-actions .btn {
        padding: 9px 11px;
        font-size: 12px;
      }

      .container {
        padding: 0 12px;
      }

      .hero {
        padding: 35px 22px;
        border-radius: 22px;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 15px;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .product-image {
        height: 150px;
        font-size: 55px;
      }

      .product-body {
        padding: 12px;
      }

      .product-title {
        font-size: 15px;
      }

      .product-price {
        font-size: 16px;
      }

      .product-actions {
        flex-direction: column;
      }

      .user-bar {
        align-items: flex-start;
      }
    }

    @media (max-width: 430px) {
      .products-grid {
        grid-template-columns: 1fr;
      }

      .header-actions .btn-primary {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>
    <div class="header-inner">

      <a href="#" class="logo">🛒 سوقي</a>

      <div class="header-actions">
        <button id="addButton" class="btn btn-primary">
          ＋ أضف منتج
        </button>

        <button id="loginButton" class="btn btn-light">
          👤 دخول
        </button>

        <button id="logoutButton" class="btn btn-danger" style="display:none;">
          تسجيل الخروج
        </button>
      </div>

    </div>
  </header>


  <main>

    <div class="container">

      <!-- =========================
           HERO
      ========================= -->

      <section class="hero">

        <h1>بيع واشتري بسهولة</h1>

        <p>
          اكتشف المنتجات المعروضة حولك، وانشر منتجاتك
          ليشوفها الجميع ويتواصلوا معك مباشرة.
        </p>

        <div class="hero-buttons">

          <button id="heroAddButton" class="btn btn-primary">
            🛍️ أضف منتجك الآن
          </button>

          <button id="heroBrowseButton" class="btn btn-light">
            🔎 تصفح المنتجات
          </button>

        </div>

      </section>


      <!-- =========================
           USER
      ========================= -->

      <div id="userBar" class="user-bar">

        <div class="user-icon">
          👤
        </div>

        <div class="user-info">
          <strong id="userName">مرحبًا بك</strong>
          <small id="userEmail"></small>
        </div>

      </div>


      <!-- =========================
           SEARCH
      ========================= -->

      <section class="search-section">

        <div class="search-box">

          <span>🔍</span>

          <input
            id="searchInput"
            type="text"
            placeholder="ابحث عن منتج، قسم، أو مكان..."
          >

        </div>

      </section>


      <!-- =========================
           CATEGORIES
      ========================= -->

      <section class="section">

        <div class="section-title">
          <h2>تصفح الأقسام</h2>
        </div>

        <div class="categories">

          <button class="category active" data-category="الكل">
            الكل
          </button>

          <button class="category" data-category="إلكترونيات">
            📱 إلكترونيات
          </button>

          <button class="category" data-category="ملابس">
            👕 ملابس
          </button>

          <button class="category" data-category="أثاث">
            🪑 أثاث
          </button>

          <button class="category" data-category="سيارات">
            🚗 سيارات
          </button>

          <button class="category" data-category="أخرى">
            📦 أخرى
          </button>

        </div>

      </section>


      <!-- =========================
           PRODUCTS
      ========================= -->

      <section id="productsSection" class="section">

        <div class="section-title">
          <h2>أحدث المنتجات</h2>
        </div>

        <div id="productsGrid" class="products-grid">

          <div class="loading">
            ⏳<br><br>
            جاري تحميل المنتجات...
          </div>

        </div>

      </section>

    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer>

    <div class="footer-inner">

      <div>
        <div class="footer-logo">
          🛒 سوقي
        </div>

        <div class="footer-text">
          سوقك الإلكتروني البسيط
        </div>
      </div>

      <div class="footer-text">
        © 2026 سوقي
      </div>

    </div>

  </footer>


  <!-- =========================
       LOGIN MODAL
  ========================= -->

  <div id="authModal" class="modal">

    <div class="modal-box">

      <button id="authClose" class="modal-close">
        ×
      </button>

      <h2>👤 حساب سوقي</h2>

      <div class="tabs">

        <button id="loginTab" class="tab active">
          تسجيل الدخول
        </button>

        <button id="signupTab" class="tab">
          إنشاء حساب
        </button>

      </div>

      <div id="authError" class="error-message"></div>
      <div id="authSuccess" class="success-message"></div>

      <div class="field">

        <label>
          البريد الإلكتروني
        </label>

        <input
          id="emailInput"
          type="email"
          placeholder="example@email.com"
        >

      </div>

      <div class="field">

        <label>
          كلمة المرور
        </label>

        <input
          id="passwordInput"
          type="password"
          placeholder="كلمة المرور"
        >

      </div>

      <div id="confirmPasswordField" class="field" style="display:none;">

        <label>
          تأكيد كلمة المرور
        </label>

        <input
          id="confirmPasswordInput"
          type="password"
          placeholder="أعد كتابة كلمة المرور"
        >

      </div>

      <div class="modal-actions">

        <button id="authAction" class="btn btn-primary">
          دخول
        </button>

        <button id="authCancel" class="btn btn-light">
          إلغاء
        </button>

      </div>

    </div>

  </div>


  <!-- =========================
       ADD PRODUCT MODAL
  ========================= -->

  <div id="productModal" class="modal">

    <div class="modal-box">

      <button id="productClose" class="modal-close">
        ×
      </button>

      <h2>🛍️ أضف منتجًا</h2>

      <div id="productError" class="error-message"></div>
      <div id="productSuccess" class="success-message"></div>

      <div class="field">

        <label>
          اسم المنتج
        </label>

        <input
          id="productName"
          type="text"
          placeholder="مثال: هاتف سامسونج"
        >

      </div>

      <div class="field">

        <label>
          السعر بالجنيه
        </label>

        <input
          id="productPrice"
          type="number"
          min="0"
          placeholder="مثال: 8500"
        >

      </div>

      <div class="field">

        <label>
          المكان
        </label>

        <input
          id="productLocation"
          type="text"
          placeholder="مثال: الزقازيق"
        >

      </div>

      <div class="field">

        <label>
          القسم
        </label>

        <select id="productCategory">

          <option value="إلكترونيات">
            📱 إلكترونيات
          </option>

          <option value="ملابس">
            👕 ملابس
          </option>

          <option value="أثاث">
            🪑 أثاث
          </option>

          <option value="سيارات">
            🚗 سيارات
          </option>

          <option value="أخرى">
            📦 أخرى
          </option>

        </select>

      </div>

      <div class="field">

        <label>
          رمز المنتج
        </label>

        <input
          id="productEmoji"
          type="text"
          maxlength="4"
          placeholder="📱"
        >

      </div>

      <div class="field">

        <label>
          رقم واتساب
        </label>

        <input
          id="productWhatsapp"
          type="tel"
          placeholder="2010xxxxxxxx"
        >

      </div>

      <div class="modal-actions">

        <button id="publishButton" class="btn btn-primary">
          🚀 نشر المنتج
        </button>

        <button id="productCancel" class="btn btn-light">
          إلغاء
        </button>

      </div>

    </div>

  </div>


  <script>

    /* =========================================
       SUPABASE

    const SUPABASE_URL =

    const SUPABASE_KEY =

    const supabaseClient =

        SUPABASE_KEY
      );


    /* =========================================
       VARIABLES

    const authModal =

    const productModal =

    const loginButton =

    const addButton =

    const heroAddButton =

    const heroBrowseButton =

    const logoutButton =

    const authClose =

    const authCancel =
      document.getElementById("authCancel");

    const productClose =
      document.getElementById("productClose");

    const productCancel =
      document.getElementById("productCancel");

    const loginTab =
      document.getElementById("loginTab");

    const signupTab =
      document.getElementById("signupTab");

    const authAction =
      document.getElementById("authAction");

    const publishButton =
      document.getElementById("publishButton");

    const searchInput =
