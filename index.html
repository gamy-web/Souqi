/* =========================

/* =========================

========================= */

const productsBox =
document.getElementById("products");

/* =========================

========================= */

function showMessage(text,type){

  messageBox.textContent = text;

  messageBox.className =
    "message " + type;

}

function hideMessage(){

  messageBox.className = "message";

  messageBox.textContent = "";

}


/* =========================
   AUTH MESSAGE
========================= */

function showAuthMessage(text,type){

  const box =
    document.getElementById("authMessage");

  box.textContent = text;

  box.className =
    "auth-message " + type;

}

function clearAuthMessage(){

  const box =
    document.getElementById("authMessage");

  box.textContent = "";

  box.className =
    "auth-message";

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   WHATSAPP
========================= */

function whatsappNumber(phone){

  let number =
    String(phone || "")
    .replace(/\D/g,"");

  if(number.startsWith("01")){
    number = "20" + number.substring(1);
  }

  if(number.startsWith("0020")){
    number = number.substring(2);
  }

  return number;

}


/* =========================
   OPEN AUTH
========================= */

function openAuth(){

}

  authModal.style.display = "none";

  clearAuthMessage();

}

function closeProduct(){

/* =========================
   LOGIN MODE
========================= */

function setLoginMode(){

  authMode = "login";

  document.getElementById("loginTab")
    .classList.add("active");

  document.getElementById("signupTab")
    .classList.remove("active");

  document.getElementById("password2")

  document.getElementById("authAction")

  authMode = "signup";

  document.getElementById("loginTab")

  document.getElementById("signupTab")
    .classList.add("active");

  document.getElementById("password2")
    .style.display = "block";

========================= */

  const password2 =

  if(!email || !password){

    showAuthMessage(
      "اكتب البريد الإلكتروني وكلمة المرور.",
      "error"
    );

    return;

  }


  if(authMode === "signup"){

    if(password !== password2){

      showAuthMessage(
        "كلمتا المرور غير متطابقتين.",
        "error"
      );

      return;

    }

    if(password.length < 6){

      showAuthMessage(
        "كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
        "error"
      );

      return;

    }


    const {data,error} =
      await supabaseClient.auth.signUp({
        email:email,
        password:password
      });


    if(error){

      showAuthMessage(
        error.message,
        "error"
      );

      return;

    }


    if(data.session){

      showAuthMessage(
        "تم إنشاء الحساب وتسجيل الدخول بنجاح ✅",
        "success"
      );

      setTimeout(closeAuth,1000);

    }else{

      showAuthMessage(
        "تم إنشاء الحساب. راجع بريدك الإلكتروني لتأكيد الحساب ✅",
        "success"
      );

    }

    return;

  }


  const {data,error} =
    await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });


  if(error){

    showAuthMessage(
      "بيانات الدخول غير صحيحة أو الحساب غير مؤكد.",
      "error"
    );

    return;

  }


  currentUser = data.user;

  updateUserUI();

  showAuthMessage(
    "تم تسجيل الدخول بنجاح ✅",
    "success"
  );

  setTimeout(closeAuth,700);

}


/* =========================
   USER UI
========================= */

function updateUserUI(){

  if(currentUser){

    userBox.style.display = "block";

    userEmail.textContent =
      currentUser.email || "مستخدم";

    loginButton.textContent =
      "👤 حسابي";

  }else{

    userBox.style.display = "none";

    userEmail.textContent = "";

    loginButton.textContent =
      "👤 دخول";

  }

}
