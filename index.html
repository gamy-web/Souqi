<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوقي</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f5f5;
  color:#222;
}

header{
  background:#0d6efd;
  color:white;
  padding:25px 15px;
  text-align:center;
}

header h1{
  margin:0 0 10px;
  font-size:42px;
}

header div{
  font-size:22px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.top-buttons{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  cursor:pointer;
  font-size:16px;
}

.login-btn{
  background:white;
  color:#0d6efd;
  min-width:150px;
}

.add-btn{
  background:#198754;
  color:white;
  flex:1;
}

.user-box{
  background:white;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  display:none;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logout-btn{
  background:#dc3545;
  color:white;
}

.search-box{
  width:100%;
  padding:15px;
  border:1px solid #ccc;
  border-radius:8px;
  margin-bottom:12px;
  font-size:17px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:15px;
  padding-bottom:3px;
}

.category-btn{
  background:white;
  border:1px solid #ddd;
  white-space:nowrap;
}

.category-btn.active{
  background:#0d6efd;
  color:white;
}

.msg{
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  display:none;
}

.msg.error{
  display:block;
  background:#f8d7da;
  color:#842029;
}

.msg.success{
  display:block;
  background:#d1e7dd;
  color:#0f5132;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-icon{
  font-size:45px;
  text-align:center;
  margin-bottom:10px;
}

.card h3{
  margin:5px 0;
  font-size:23px;
}

.price{
  color:#198754;
  font-size:20px;
  font-weight:bold;
}

.location,
.category{
  color:#666;
  margin:7px 0;
}

.whatsapp{
  display:block;
  background:#25D366;
  color:white;
  text-decoration:none;
  text-align:center;
  padding:11px;
  border-radius:8px;
  margin-top:12px;
}

.empty{
  text-align:center;
  background:white;
  padding:30px;
  border-radius:10px;
  color:#777;
  grid-column:1/-1;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:1000;
}

.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  border-radius:12px;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.modal-box h2{
  margin-top:0;
}

.modal-box input,
.modal-box select{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.save-btn{
  background:#198754;
  color:white;
  flex:1;
}

.cancel-btn{
  background:#6c757d;
  color:white;
  flex:1;
}

.auth-tabs{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.auth-tab{
  flex:1;
  background:#eee;
}

.auth-tab.active{
  background:#0d6efd;
  color:white;
}

.auth-message{
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  display:none;
}

.auth-message.error{
  display:block;
  background:#f8d7da;
  color:#842029;
}

.auth-message.success{
  display:block;
  background:#d1e7dd;
  color:#0f5132;
}
</style>
</head>

<body>

<header>
  <h1>🛒 سوقي</h1>
  <div>سوقك الإلكتروني البسيط</div>
</header>

<div class="container">

  <div class="top-buttons">

    <button
      class="login-btn"
      id="loginButton"
      onclick="openAuthModal()">
      تسجيل الدخول
    </button>

    <button
      class="add-btn"
      onclick="openModal()">
      ➕ أضف منتج
    </button>

  </div>

  <div
    class="user-box"
    id="userBox">

    <span id="userText"></span>

    <button
      class="logout-btn"
      onclick="logout()">
      تسجيل الخروج
    </button>

  </div>

  <input
    id="search"
    class="search-box"
    type="text"
    placeholder="🔍 ابحث عن منتج..."
    oninput="filterProducts()">

  <div class="categories">

    <button
      class="category-btn active"
      onclick="selectCategory('الكل',this)">
      الكل
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('إلكترونيات',this)">
      إلكترونيات
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('ملابس',this)">
      ملابس
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('أثاث',this)">
      أثاث
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('سيارات',this)">
      سيارات
    </button>

    <button
      class="category-btn"
      onclick="selectCategory('أخرى',this)">
      أخرى
    </button>

  </div>

  <div
    id="status"
    class="msg">
  </div>

  <div
    id="products"
    class="products">
  </div>

</div>


<!-- تسجيل الدخول -->
<div
  id="authModal"
  class="modal">

  <div class="modal-box">

    <h2>👤 حساب سوقي</h2>

    <div class="auth-tabs">

      <button
        id="loginTab"
        class="auth-tab active"
        onclick="showLogin()">
        تسجيل الدخول
      </button>

      <button
        id="signupTab"
        class="auth-tab"
        onclick="showSignup()">
        إنشاء حساب
      </button>

    </div>

    <input
      id="authEmail"
      type="email"
      placeholder="البريد الإلكتروني">

    <input
      id="authPassword"
      type="password"
      placeholder="كلمة المرور">

    <div
      id="signupPasswordAgain"
      style="display:none">

      <input
        id="authPasswordAgain"
        type="password"
        placeholder="تأكيد كلمة المرور">

    </div>

    <div
      id="authMessage"
      class="auth-message">
    </div>

    <div class="modal-buttons">

      <button
        id="authActionButton"
        class="save-btn"
        onclick="loginUser()">
        دخول
      </button>

      <button
        class="cancel-btn"
        onclick="closeAuthModal()">
        إلغاء
      </button>

    </div>

  </div>
</div>


<!-- إضافة منتج -->
<div
  id="modal"
  class="modal">

  <div class="modal-box">

    <h2>➕ إضافة منتج</h2>

    <input
      id="name"
      type="text"
      placeholder="اسم المنتج">

    <input
      id="price"
      type="number"
      placeholder="السعر">

    <input
      id="location"
      type="text"
      placeholder="المكان">

    <select id="category">

      <option value="">
        اختر القسم
      </option>

      <option value="إلكترونيات">
        إلكترونيات
      </option>

      <option value="ملابس">
        ملابس
      </option>

      <option value="أثاث">
        أثاث
      </option>

      <option value="سيارات">
        سيارات
      </option>

      <option value="أخرى">
        أخرى
      </option>

    </select>

    <input
      id="icon"
      type="text"
      placeholder="إيموجي المنتج مثل 📱">

    <input
      id="phone"
      type="text"
      placeholder="رقم واتساب">

    <div class="modal-buttons">

      <button
        class="save-btn"
        onclick="addProduct()">
        نشر المنتج
      </button>

      <button
        class="cancel-btn"
        onclick="closeModal()">
        إلغاء
      </button>

    </div>

  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://dbufhbeygczlfttdpinf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_ffb08aL-n96nfgZZwjj3fw_KolUjymN";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let allProducts = [];

let selectedCategory = "الكل";

let authMode = "login";


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

  const productsBox =
    document.getElementById("products");

  productsBox.innerHTML =
    '<div class="empty">جاري تحميل المنتجات...</div>';

  try{

    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
          ascending:false
        });

    if(error){
      throw error;
    }

    allProducts = data || [];

    filterProducts();

  }catch(error){

    productsBox.innerHTML =
      '<div class="empty">لا توجد منتجات حالياً</div>';

    showStatus(
      "خطأ: " + error.message,
      "error"
    );

    console.error(error);

  }

}


/* =========================
   عرض المنتجات
========================= */

function displayProducts(products){

  const box =
    document.getElementById("products");

  if(!products.length){

    box.innerHTML =
      '<div class="empty">لا توجد منتجات مطابقة للبحث</div>';

    return;
  }

  box.innerHTML =
    products.map(product => {

      const icon =
        product.icon || "📦";

      const phone =
        String(product.phone || "")
        .replace(/\s+/g,"")
        .replace(/^0+/,"");

      const whatsappNumber =
        phone.startsWith("20")
        ? phone
        : "20" + phone;

      return `

        <div class="card">

          <div class="card-icon">
            ${escapeHtml(icon)}
          </div>

          <h3>
            ${escapeHtml(product.name)}
          </h3>

          <div class="price">
            ${escapeHtml(product.price)} جنيه
          </div>

          <div class="location">
            📍 ${escapeHtml(product.location)}
          </div>

          <div class="category">
            🏷️ ${escapeHtml(product.category)}
          </div>

          <a
            class="whatsapp"
            href="https://wa.me/${whatsappNumber}"
            target="_blank">
            💬 تواصل عبر واتساب
          </a>

        </div>

      `;

    }).join("");

}


/* =========================
   البحث
========================= */

function filterProducts(){

  const search =
    document.getElementById("search")
    .value
    .trim()
    .toLowerCase();

  const filtered =
    allProducts.filter(product => {

      const matchesSearch =
        !search ||

        String(product.name || "")
        .toLowerCase()
        .includes(search) ||

        String(product.location || "")
        .toLowerCase()
        .includes(search) ||

        String(product.category || "")
        .toLowerCase()
        .includes(search);

      const matchesCategory =
        selectedCategory === "الكل" ||
        product.category === selectedCategory;

      return matchesSearch &&
             matchesCategory;

    });

  displayProducts(filtered);

}


/* =========================
   الأقسام
========================= */

function selectCategory(category,button){

  selectedCategory =
    category;

  document
    .querySelectorAll(".category-btn")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  filterProducts();

}


/* =========================
   إضافة منتج
========================= */

function openModal(){

  document
    .getElementById("modal")
    .style.display = "flex";

}


function closeModal(){

  document
    .getElementById("modal")
    .style.display = "none";

}


async function addProduct(){

  /* التأكد أن المستخدم مسجل */

  const {
    data: userData,
    error: userError
  } = await supabaseClient.auth.getUser();

  if(userError || !userData.user){

    alert(
      "لازم تسجل الدخول أولاً قبل إضافة منتج."
    );

    openAuthModal();

    return;
  }

  const user =
    userData.user;


  const name =
    document.getElementById("name")
    .value.trim();

  const price =
    document.getElementById("price")
    .value.trim();

  const location =
    document.getElementById("location")
    .value.trim();

  const category =
    document.getElementById("category")
    .value;

  const icon =
    document.getElementById("icon")
    .value.trim() || "📦";

  const phone =
    document.getElementById("phone")
    .value.trim();


  if(
    !name ||
    !price ||
    !location ||
    !category ||
    !phone
  ){

    alert(
      "من فضلك املأ كل البيانات المطلوبة"
    );

    return;
  }


  try{

    /* إضافة المنتج مع صاحب المنتج */

    const { error } =
      await supabaseClient
        .from("products")
        .insert({

          name:name,

          price:Number(price),

          location:location,

          category:category,

          icon:icon,

          phone:phone,

          user_id:user.id

        });


    if(error){
      throw error;
    }


    showStatus(
      "تم نشر المنتج بنجاح ✅",
      "success"
    );


    document.getElementById("name").value = "";

    document.getElementById("price").value = "";

    document.getElementById("location").value = "";

    document.getElementById("category").value = "";

    document.getElementById("icon").value = "";

    document.getElementById("phone").value = "";


    closeModal();

    await loadProducts();


  }catch(error){

    showStatus(
      "خطأ أثناء نشر المنتج: " +
      error.message,
      "error"
    );

    console.error(error);

  }

}


/* =========================
   تسجيل الدخول
========================= */

function openAuthModal(){

  document
    .getElementById("authModal")
    .style.display = "flex";

  showLogin();

}


function closeAuthModal(){

  document
    .getElementById("authModal")
    .style.display = "none";

  clearAuthMessage();

}


function showLogin(){

  authMode = "login";

  document
    .getElementById("loginTab")
    .classList.add("active");

  document
    .getElementById("signupTab")
    .classList.remove("active");

  document
    .getElementById("signupPasswordAgain")
    .style.display = "none";

  document
    .getElementById("authActionButton")
    .textContent = "دخول";

  document
    .getElementById("authActionButton")
    .onclick = loginUser;

  clearAuthMessage();

}


function showSignup(){

  authMode = "signup";

  document
    .getElementById("signupTab")
    .classList.add("active");

  document
    .getElementById("loginTab")
    .classList.remove("active");

  document
    .getElementById("signupPasswordAgain")
    .style.display = "block";

  document
    .getElementById("authActionButton")
    .textContent = "إنشاء الحساب";

  document
    .getElementById("authActionButton")
    .onclick = signupUser;

  clearAuthMessage();

}


function clearAuthMessage(){

  const box =
    document.getElementById("authMessage");

  box.style.display = "none";

  box.textContent = "";

  box.className =
    "auth-message";

}


function showAuthMessage(message,type){

  const box =
    document.getElementById("authMessage");

  box.textContent =
    message;

  box.className =
    "auth-message " + type;

}


/* =========================
   إنشاء حساب
========================= */

async function signupUser(){

  const email =
    document
      .getElementById("authEmail")
      .value.trim();

  const password =
    document
      .getElementById("authPassword")
      .value;

  const passwordAgain =
    document
      .getElementById("authPasswordAgain")
      .value;


  if(
    !email ||
    !password ||
    !passwordAgain
  ){

    showAuthMessage(
      "اكتب البريد الإلكتروني وكلمة المرور وتأكيد كلمة المرور",
      "error"
    );

    return;
  }


  if(password.length < 6){

    showAuthMessage(
      "كلمة المرور يجب أن تكون 6 أحرف على الأقل",
      "error"
    );

    return;
  }


  if(password !== passwordAgain){

    showAuthMessage(
      "كلمتا المرور غير متطابقتين",
      "error"
    );

    return;
  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.signUp({

        email:email,

        password:password,

        options:{
          emailRedirectTo:
            "https://gamy-web.github.io/Souqi/"
        }

      });


    if(error){
      throw error;
    }


    showAuthMessage(
      "تم إنشاء الحساب ✅ افتح بريدك الإلكتروني واضغط رابط التأكيد.",
      "success"
    );


  }catch(error){

    showAuthMessage(
      "خطأ: " + error.message,
      "error"
    );

  }

}


/* =========================
   تسجيل الدخول
========================= */

async function loginUser(){

  const email =
    document
      .getElementById("authEmail")
      .value.trim();

  const password =
    document
      .getElementById("authPassword")
      .value;


  if(!email || !password){

    showAuthMessage(
      "اكتب البريد الإلكتروني وكلمة المرور",
      "error"
    );

    return;
  }


  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth
        .signInWithPassword({

          email:email,

          password:password

        });


    if(error){
      throw error;
    }


    showAuthMessage(
      "تم تسجيل الدخول بنجاح ✅",
      "success"
    );


    setTimeout(() => {

      closeAuthModal();

      updateUserBox();

    },800);


  }catch(error){

    showAuthMessage(
      "خطأ: " + error.message,
      "error"
    );

  }

}


/* =========================
   المستخدم الحالي
========================= */

async function updateUserBox(){

  const {
    data
  } =
    await supabaseClient.auth.getUser();

  const user =
    data.user;

  const userBox =
    document.getElementById("userBox");

  const loginButton =
    document.getElementById("loginButton");

  const userText =
    document.getElementById("userText");


  if(user){

    userBox.style.display =
      "flex";

    userText.textContent =
      "👤 " + user.email;

    loginButton.style.display =
      "none";

  }else{

    userBox.style.display =
      "none";

    loginButton.style.display =
      "block";

  }

}


/* =========================
   تسجيل الخروج
========================= */

async function logout(){

  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if(error){

    alert(
      "حدث خطأ أثناء تسجيل الخروج: " +
      error.message
    );

    return;
  }


  updateUserBox();

  alert(
    "تم تسجيل الخروج ✅"
  );

}


/* =========================
   الرسائل
========================= */

function showStatus(message,type){

  const status =
    document.getElementById("status");

  if(!message){

    status.style.display =
      "none";

    return;
  }

  status.className =
    "msg " + type;

  status.textContent =
    message;

}


/* =========================
   حماية النص
========================= */

function escapeHtml(value){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =========================
   إغلاق النوافذ
========================= */

window.addEventListener(
  "click",
  function(event){

    const modal =
      document.getElementById("modal");

    const authModal =
      document.getElementById("authModal");


    if(event.target === modal){

      closeModal();

    }


    if(event.target === authModal){

      closeAuthModal();

    }

  }
);


/* =========================
   مراقبة تسجيل الدخول
========================= */

supabaseClient.auth.onAuthStateChange(
  function(){

    updateUserBox();

  }
);


/* =========================
   تشغيل الموقع
========================= */

loadProducts();

updateUserBox();

</script>

</body>
      </html>
