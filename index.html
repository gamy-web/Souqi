<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سوقي</title>
<style>body{font-family:Tahoma,Arial;margin:0;background:#f5f7f8;color:#17202a}.bar{background:#fff;padding:16px 6%;display:flex;gap:12px;align-items:center;border-bottom:1px solid #ddd}.logo{color:#087f5b;font-size:26px;font-weight:900;margin-left:auto}.wrap{max-width:1100px;margin:25px auto;padding:0 18px}.hero{background:#087f5b;color:#fff;padding:35px;border-radius:20px}.search{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin:18px 0;font-size:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:#fff;border-radius:15px;border:1px solid #ddd;padding:15px}.emoji{font-size:55px;text-align:center;background:#eee;padding:25px;border-radius:12px}button{padding:11px 15px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.primary{background:#087f5b;color:#fff}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head>
<body><div class="bar"><div class="logo">سوقي</div><button class="primary" onclick="alert('صفحة الدخول ستُربط بقاعدة البيانات في المرحلة التالية')">تسجيل الدخول</button><button onclick="alert('لوحة الأدمن ستحتاج تسجيل دخول آمن في الإصدار الإنتاجي')">لوحة الأدمن</button></div>
<div class="wrap"><div class="hero"><h1>سوقي</h1><p>بيع واشتري منتجاتك بسهولة.</p><button onclick="alert('نموذج إضافة المنتج')">+ بيع منتج</button></div><input id="q" class="search" placeholder="ابحث عن منتج..." oninput="render()"><div id="grid" class="grid"></div></div>
<script>const p=[['هاتف ذكي',8500,'📱','إلكترونيات'],['تيشيرت رجالي',450,'👕','ملابس'],['كنبة مودرن',6200,'🛋️','أثاث'],['سيارة مستعملة',185000,'🚗','سيارات'],['سماعة بلوتوث',900,'🎧','إلكترونيات'],['حقيبة ظهر',700,'🎒','مستلزمات']];function render(){let q=document.getElementById('q').value.toLowerCase();document.getElementById('grid').innerHTML=p.filter(x=>x[0].toLowerCase().includes(q)).map(x=>`<div class="card"><div class="emoji">${x[2]}</div><h3>${x[0]}</h3><b style="color:#087f5b">${x[1].toLocaleString('ar-EG')} جنيه</b><p>${x[3]}</p><button class="primary" onclick="alert('تفاصيل المنتج: ${x[0]}')">التفاصيل</button></div>`).join('')}</script></body></html>
