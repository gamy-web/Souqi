<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوقي 🛒</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f6fb;color:#222}
header{background:linear-gradient(135deg,#1769e0,#2854d9);color:white;padding:25px 15px 30px;text-align:center}
.logo{font-size:42px;font-weight:bold;color:#ffd92f;margin-bottom:20px}
.top{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:18px;padding:16px 30px;font-size:20px;cursor:pointer}
.add{background:#20c866;color:white}
.login{background:white;color:#2454c7}
.search{max-width:700px;margin:20px auto;display:flex;gap:10px;padding:0 15px}
.search input{flex:1;padding:15px;border:1px solid #ccc;border-radius:15px;font-size:18px}
.search button{background:#2464df;color:white;padding:12px 20px}
.categories{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:15px}
.cat{background:white;border:2px solid #ddd;padding:14px 25px;border-radius:18px;font-size:19px}
.cat.active{background:#2865df;color:white;border-color:#2865df}
main{max-width:1100px;margin:auto;padding:10px 15px 50px}
h2{text-align:right;font-size:34px;margin:30px 10px}
#products{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{background:white;border-radius:22px;padding:20px;box-shadow:0 3px 12px #ddd}
.icon{font-size:55px;text-align:center}
.card h3{font-size:23px;margin:12px 0}
.price{font-size:22px;color:#1769e0;font-weight:bold}
.info{color:#555;margin:8px 0}
.whatsapp{display:block;background:#19b957;color:white;text-align:center;text-decoration:none;padding:13px;border-radius:14px;margin-top:15px;font-size:18px}
.msg{text-align:center;background:white;border-radius:22px;padding:30px;font-size:20px;margin:20px 0}
.error{color:#c33}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:20px;overflow:auto}
.box{background:white;max-width:600px;margin:20px auto;padding:25px;border-radius:25px}
.close{float:left;background:none;padding:0;font-size:30px}
label{display:block;font-weight:bold;font-size:19px;margin:15px 0 7px}
input,select{width:100%;padding:15px;border:2px solid #ddd;border-radius:15px;font-size:17px}
.submit{width:100%;background:#2865df;color:white;margin-top:20px}
@media(max-width:600px){
.logo{font-size:36px}
.top button{width:90%}
h2{font-size:30px}
}
</style>
</head>

<body>

<header>
<div class="logo">سوقي 🛒</div>
<div class="top">
<button class="add" onclick="openAdd()">➕ أضف منتج</button>
<button class="login" onclick="login()">تسجيل الدخول</button>
</div>
</header>

<div class="search">
<input id="search" placeholder="ابحث عن منتج..." onkeydown="if(event.key==='Enter')searchProducts()">
<button onclick="searchProducts()">🔍 بحث</button>
</div>

<div class="categories">
<button class="cat active" onclick="filterCat('الكل',this)">الكل</button>
<button class="cat" onclick="filterCat('إلكترونيات',this)">📱 إلكترونيات</button>
<button class="cat" onclick="filterCat('سيارات',this)">🚗 سيارات</button>
<button class="cat" onclick="filterCat('ملابس',this)">👕 ملابس</button>
<button class="cat" onclick="filterCat('منزل',this)">🏠 منزل</button>
<button class="cat" onclick="filterCat('أخرى',this)">📦 أخرى</button>
</div>

<main>
<h2>🛍️ المنتجات</h2>
<div id="status" class="msg">جاري تحميل المنتجات...</div>
<div id="products"></div>
</main>

<div id="modal" class="modal">
<div class="box">
<button class="close" onclick="closeAdd()">✕</button>
<h2>➕ إضافة منتج جديد</h2>

<label>اسم المنتج</label>
<input id="name" placeholder="مثال: هاتف سامسونج">

<label>السعر بالجنيه</label>
<input id="price" type="number" placeholder="مثال: 5000">

<label>المحافظة / المكان</label>
<input id="location" placeholder="مثال: الشرقية">

<label>القسم</label>
<select id="category">
<option value="">اختر القسم</option>
<option>إلكترونيات</option>
<option>سيارات</option>
<option>ملابس</option>
<option>منزل</option>
<option>أخرى</option>
</select>

<label>رمز المنتج</label>
<select id="icon">
<option value="📦">📦 منتج</option>
<option value="📱">📱 هاتف</option>
<option value="💻">💻 لابتوب</option>
<option value="🚗">🚗 سيارة</option>
<option value="👕">👕 ملابس</option>
<option value="🏠">🏠 منزل</option>
<option value="🎧">🎧 سماعات</option>
</select>

<label>رقم واتساب للتواصل</label>
<input id="phone" value="01201966196" placeholder="01xxxxxxxxx">

<button class="submit" onclick="addProduct()">نشر المنتج</button>
<div id="addStatus" class="msg" style="display:none"></div>
</div>
</div>

<script>
const SUPABASE_URL="https://dbufhbeygczlfitdpinf.supabase.co";
const SUPABASE_KEY="sb_publishable_ffb08aL-n96nfgZZwjj3fw_KolUjymN";

let allProducts=[];
let currentCat="الكل";

async function loadProducts(){
const status=document.getElementById("status");
try{
const res=await fetch(SUPABASE_URL+"/rest/v1/products?select=*&order=created_at.desc",{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}});
if(!res.ok)throw new Error(await res.text());
allProducts=await res.json();
status.style.display="none";
showProducts();
}catch(e){
status.className="msg error";
status.textContent="حصلت مشكلة في تحميل المنتجات. تأكد من اتصال الإنترنت ثم جرّب مرة أخرى.";
console.error(e);
}
}

function showProducts(){
const box=document.getElementById("products");
const word=document.getElementById("search").value.trim().toLowerCase();
let list=allProducts.filter(p=>{
let cat=currentCat==="الكل"||p.category===currentCat;
let search=!word||String(p.name).toLowerCase().includes(word)||String(p.location).toLowerCase().includes(word);
return cat&&search;
});
box.innerHTML="";
if(!list.length){
box.innerHTML='<div class="msg">لا توجد منتجات حالياً.<br>كن أول شخص يضيف منتجاً 🚀</div>';
return;
}
list.forEach(p=>{
const card=document.createElement("div");
card.className="card";
const icon=document.createElement("div");
icon.className="icon";
icon.textContent=p.icon||"📦";
const title=document.createElement("h3");
title.textContent=p.name;
const price=document.createElement("div");
price.className="price";
price.textContent=Number(p.price).toLocaleString("ar-EG")+" جنيه";
const loc=document.createElement("div");
loc.className="info";
loc.textContent="📍 "+p.location;
const cat=document.createElement("div");
cat.className="info";
cat.textContent="📂 "+p.category;
const wa=document.createElement("a");
wa.className="whatsapp";
wa.textContent="💬 تواصل واتساب";
let phone=String(p.phone||"").replace(/\D/g,"");
if(phone.startsWith("0"))phone="20"+phone.substring(1);
wa.href="https://wa.me/"+phone;
wa.target="_blank";
card.append(icon,title,price,loc,cat,wa);
box.appendChild(card);
});
}

function filterCat(cat,btn){
currentCat=cat;
document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
btn.classList.add("active");
showProducts();
}

function searchProducts(){showProducts()}

function openAdd(){
document.getElementById("modal").style.display="block";
}
function closeAdd(){
document.getElementById("modal").style.display="none";
}

function login(){
alert("تسجيل الدخول سيتم تفعيله في الخطوة القادمة إن شاء الله.");
}

async function addProduct(){
const name=document.getElementById("name").value.trim();
const price=document.getElementById("price").value;
const location=document.getElementById("location").value.trim();
const category=document.getElementById("category").value;
const icon=document.getElementById("icon").value;
const phone=document.getElementById("phone").value.trim();
const st=document.getElementById("addStatus");

if(!name||!price||!location||!category||!phone){
alert("من فضلك املأ كل البيانات.");
return;
}

st.style.display="block";
st.textContent="جاري نشر المنتج...";

try{
const res=await fetch(SUPABASE_URL+"/rest/v1/products",{
method:"POST",
headers:{
"apikey":SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=representation"
},
body:JSON.stringify({
name:name,
price:Number(price),
location:location,
category:category,
icon:icon,
phone:phone
})
});
if(!res.ok)throw new Error(await res.text());

st.textContent="✅ تم نشر المنتج بنجاح";
document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("location").value="";
document.getElementById("category").value="";
document.getElementById("phone").value="01201966196";

await loadProducts();

setTimeout(()=>{
closeAdd();
st.style.display="none";
},1000);

}catch(e){
st.className="msg error";
st.textContent="❌ لم يتم نشر المنتج. جرّب مرة أخرى.";
console.error(e);
}
}

loadProducts();
</script>

</body>
</html>
