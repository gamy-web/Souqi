/* =========================
   أساسيات
========================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    "Segoe UI",
    Tahoma,
    Arial,
    sans-serif;
  background:#f6f8fc;
  color:#172033;
}

button,
input,
select{

}

button{

}


/* =========================
   الهيدر
========================= */

.header{
  background:
    linear-gradient(135deg,#1261e8,#1749b7);
  color:white;
  position:relative;
  overflow:hidden;
}

.header::before{
  content:"";
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  top:-130px;
  left:-80px;
}

.header::after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  border-radius:50%;
  background:rgba(255,255,255,.06);
  bottom:-140px;
  right:-70px;
}

.nav{
  max-width:1150px;
  margin:auto;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  position:relative;
  z-index:2;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:28px;
  font-weight:900;
}

.logo-icon{
  width:48px;
  height:48px;
  background:white;
  color:#1261e8;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
  box-shadow:0 8px 25px rgba(0,0,0,.15);
}

.nav-actions{
  display:flex;
  align-items:center;
  gap:10px;
}

.nav-button{
  border:0;
  border-radius:12px;
  padding:11px 17px;
  font-size:15px;
  font-weight:700;
  background:rgba(255,255,255,.15);
  color:white;
  border:1px solid rgba(255,255,255,.2);
}

.nav-button:hover{
  background:rgba(255,255,255,.25);
}

.nav-add{
  background:white;
  color:#1261e8;
}


/* =========================
   الهيرو
========================= */

.hero{
  max-width:1150px;
  margin:auto;
  padding:45px 20px 65px;
  position:relative;
  z-index:2;
}

.hero-content{
  max-width:720px;
}

.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.2);
  padding:8px 13px;
  border-radius:30px;
  font-size:14px;
  margin-bottom:18px;
}

.hero h1{
  margin:0;
  font-size:48px;
  line-height:1.2;
  letter-spacing:-1px;
}

.hero h1 span{
  color:#bfe0ff;
}

.hero p{
  font-size:19px;
  line-height:1.8;
  color:#e3edff;
  margin:18px 0 28px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.hero-main-button{
  background:white;
  color:#1261e8;
  border:0;
  border-radius:14px;
  padding:14px 24px;
  font-size:17px;
  font-weight:800;
  box-shadow:0 10px 25px rgba(0,0,0,.12);
}

.hero-main-button:hover{
  transform:translateY(-2px);
}

.hero-second-button{
  background:rgba(255,255,255,.1);
  color:white;
  border:1px solid rgba(255,255,255,.25);
  border-radius:14px;
  padding:14px 24px;
  font-size:17px;
  font-weight:700;
}


/* =========================
   المستخدم
========================= */

.user-box{
  display:none;
  max-width:1150px;
  margin:-25px auto 25px;
  padding:0 20px;
  position:relative;
  z-index:5;
}

.user-inner{
  background:white;
  border-radius:18px;
  padding:14px 18px;
  box-shadow:0 10px 35px rgba(20,40,80,.1);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.user-info{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
}

.user-avatar{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#e9f1ff;
  color:#1261e8;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.logout{
  border:0;
  background:#fff0f1;
  color:#dc3545;
  border-radius:10px;
  padding:10px 15px;
  font-weight:700;
}


/* =========================
   المحتوى
========================= */

.container{
  max-width:1150px;
  margin:auto;
  padding:0 20px 50px;
}


/* =========================
   البحث
========================= */

.search-area{
  margin-bottom:28px;
}

.search-box{
  background:white;
  border-radius:20px;
  padding:7px;
  box-shadow:0 8px 30px rgba(30,50,90,.08);
  display:flex;
  align-items:center;
}

.search-icon{
  font-size:23px;
  padding:0 13px;
}

.search-input{
  flex:1;
  border:0;
  outline:0;
  padding:15px 8px;
  font-size:17px;
  background:transparent;
  color:#172033;
}

.search-input::placeholder{
  color:#9aa4b2;
}


/* =========================
   الأقسام
========================= */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.section-title h2{
  margin:0;
  font-size:22px;
}

.section-title span{
  color:#7b8798;
  font-size:14px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:3px 2px 12px;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.category{
  flex:0 0 auto;
  border:1px solid #e1e6ef;
  background:white;
  color:#526074;
  padding:11px 18px;
  border-radius:30px;
  font-size:15px;
  font-weight:700;
  transition:.2s;
}

.category:hover{
  border-color:#1261e8;
  color:#1261e8;
}

.category.active{
  background:#1261e8;
  color:white;
  border-color:#1261e8;
  box-shadow:0 7px 18px rgba(18,97,232,.22);
}


/* =========================
   الرسائل
========================= */

.message{
  display:none;
  padding:14px 17px;
  border-radius:14px;
  margin:20px 0;
  font-weight:700;
}

.message.success{
  display:block;
  background:#e4f7ed;
  color:#137344;
  border:1px solid #c8ecd9;
}

.message.error{
  display:block;
  background:#fff0f1;
  color:#a51f2c;
  border:1px solid #ffd2d6;
}


/* =========================
   المنتجات
========================= */

.products-head{
  margin-top:30px;
  margin-bottom:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.products-head h2{
  margin:0;
  font-size:23px;
}

.products-count{
  color:#7b8798;
  font-size:14px;
}

.products{
  display:grid;
  grid-template-columns:

  gap:20px;
}

.card{
  background:white;
  border:1px solid #e9edf3;
  border-radius:22px;
  overflow:hidden;
  box-shadow:
    0 8px 30px rgba(30,50,90,.07);
  transition:.25s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:
    0 16px 40px rgba(30,50,90,.12);
}

.card-top{
  min-height:175px;
  background:
    linear-gradient(145deg,#eef5ff,#f8fbff);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.card-icon{
  font-size:78px;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.08));
}

.category-label{
  position:absolute;
  top:12px;
  right:12px;
  background:white;
  color:#526074;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.card-body{
  padding:18px;
}

.card h3{
  margin:0 0 12px;
  font-size:21px;
}

.price{
  font-size:25px;
  font-weight:900;
  color:#15805a;
  margin-bottom:12px;
}

.price small{
  font-size:14px;
  font-weight:700;
  color:#6b7788;
}

.card-info{
  color:#6b7585;
  font-size:14px;
  margin:8px 0;
}

.whatsapp{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  text-decoration:none;
  background:#20c96b;
  color:white;
  padding:13px;
  border-radius:12px;
  margin-top:16px;
  font-weight:800;
  transition:.2s;
}

.whatsapp:hover{
  background:#16ae59;
}

.delete{
  width:100%;
  border:0;
  background:#fff0f1;
  color:#d52d3d;
  padding:12px;
  border-radius:12px;
  margin-top:8px;
  font-weight:700;

.delete:hover{
  background:#ffe0e3;

/* =========================

.empty{

  border:1px dashed #d6dce5;
  border-radius:20px;
  padding:55px 20px;
  text-align:center;
  color:#7b8798;
}

.empty-icon{
  font-size:50px;
  margin-bottom:10px;
}


/* =========================
   المودال
========================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(10,20,40,.62);
  backdrop-filter:blur(5px);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  width:100%;
  max-width:480px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:24px;
  padding:25px;
  box-shadow:0 25px 70px rgba(0,0,0,.2);

.modal-header{

  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;

.modal-header h2{

.close{

  height:38px;
  border:0;
  border-radius:50%;
  background:#f1f3f7;
  font-size:20px;
}

.input{
  width:100%;
  padding:14px 15px;
  margin:6px 0;
  border:1px solid #dce2ea;
  border-radius:12px;
  outline:0;
  font-size:16px;
  background:#fafbfc;
}

.input:focus{
  border-color:#1261e8;
  background:white;
  box-shadow:0 0 0 3px rgba(18,97,232,.08);
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.save{
  flex:1;
  border:0;
  background:#1261e8;
  color:white;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:800;
}

.cancel{
  flex:1;
  border:0;
  background:#eef1f5;
  color:#526074;
  padding:14px;
  border-radius:12px;
  font-size:16px;
  font-weight:700;
}

.tabs{
  display:flex;
  gap:7px;
  background:#f1f3f7;
  padding:5px;
  border-radius:12px;
  margin-bottom:15px;
}

.tab{
  flex:1;
  border:0;
  background:transparent;
  padding:11px;
  border-radius:9px;
  font-weight:700;
  color:#697586;
}

.tab.active{
  background:white;
  color:#1261e8;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.auth-message{
  display:none;
  padding:11px;
  border-radius:10px;
  margin-top:10px;
  font-size:14px;
  font-weight:600;
}

.auth-message.error{
  display:block;
  background:#fff0f1;
  color:#a51f2c;
}

.auth-message.success{
  display:block;
  background:#e4f7ed;
  color:#137344;
}


/* =========================
   الفوتر
========================= */

.footer{
  margin-top:35px;
  padding:30px 20px;
  background:#101827;
  color:#aeb8c7;
  text-align:center;
}

.footer-logo{
  color:white;
  font-size:23px;
  font-weight:900;
  margin-bottom:8px;
}

.footer p{
  margin:5px 0;
  font-size:14px;
}


/* =========================
   موبايل
========================= */

@media(max-width:600px){

  .nav{
    padding:14px;
  }

  .logo{
    font-size:22px;
  }

  .logo-icon{
    width:40px;
    height:40px;
    font-size:22px;
    border-radius:12px;
  }

  .nav-button{
    padding:9px 11px;
    font-size:13px;
  }

  .hero{
    padding:30px 15px 50px;
  }

  .hero h1{
    font-size:35px;
  }

  .hero p{
    font-size:16px;
  }

  .hero-main-button,
  .hero-second-button{
    width:100%;
    text-align:center;
  }

  .container{
    padding:0 14px 35px;
  }

  .user-box{
    padding:0 14px;
    margin-top:-20px;
  }

  .user-inner{
    align-items:flex-start;
    flex-direction:column;
  }

  .logout{
    width:100%;
  }

  .products{
    grid-template-columns:1fr;
  }

  .card-top{
    min-height:190px;
  }

  .modal-box{
    padding:20px;
  }

}


/* =========================
   حركة تحميل
========================= */

@keyframes fadeUp{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.card{
  animation:fadeUp .35s ease both;
}

</style>
</head>

/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

  messageBox.textContent = text;

  messageBox.className =
    "message " + type;

}


function hideMessage(){

  messageBox.className =
    "message";

  messageBox.textContent = "";

}



/* =========================
   AUTH MESSAGE
========================= */

function showAuthMessage(text,type){

  const box =
    document.getElementById("authMessage");

  box.textContent = text;

  box.className =
    "auth-message " + type;

}


function clearAuthMessage(){

  const box =
    document.getElementById("authMessage");

  box.textContent = "";

  box.className =
    "auth-message";

}
